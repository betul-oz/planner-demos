  // ---------------------------------------------------------------- tarih
  // Saat dilimi tuzagina dusmemek icin her sey UTC ve "YYYY-AA-GG" metni.

  function g(metin) {
    const [y, a, gun] = metin.split("-").map(Number);
    return Date.UTC(y, a - 1, gun);
  }

  function m(zaman) {
    const d = new Date(zaman);
    return d.toISOString().slice(0, 10);
  }

  function gunEkle(metin, sayi) {
    return m(g(metin) + sayi * 86400000);
  }

  function ayEkle(metin, sayi) {
    const d = new Date(g(metin));
    const hedefGun = d.getUTCDate();
    const t = Date.UTC(d.getUTCFullYear(), d.getUTCMonth() + sayi, 1);
    const son = new Date(Date.UTC(new Date(t).getUTCFullYear(),
                                  new Date(t).getUTCMonth() + 1, 0)).getUTCDate();
    return m(Date.UTC(new Date(t).getUTCFullYear(), new Date(t).getUTCMonth(),
                      Math.min(hedefGun, son)));
  }

  function gunFarki(a, b) {
    return Math.round((g(b) - g(a)) / 86400000);
  }

  // ---------------------------------------------------------------- donem
  // Maas donemi. Alicinin butun dunyasi bu: "bir sonraki maasa kadar".

  const DONEM = {
    weekly: 7,
    biweekly: 14,
  };

  /** Verilen tarihi iceren odeme doneminin [baslangic, bitis) araligi.
   *  bitis, bir sonraki donemin baslangicidir: donemler bosluksuz doser. */
  function donemAraligi(donem, tarih) {
    const ilk = donem.ilkOdeme;
    if (donem.tip === "weekly" || donem.tip === "biweekly") {
      const adim = DONEM[donem.tip];
      const fark = gunFarki(ilk, tarih);
      const kac = Math.floor(fark / adim);
      const bas = gunEkle(ilk, kac * adim);
      return { bas: bas, bitis: gunEkle(bas, adim) };
    }
    if (donem.tip === "monthly") {
      // Her sinir ilkOdeme'nin GUNUNDEN yeniden hesaplanir: art arda ayEkle
      // 31'i bir kez 28'e kirpinca sonraki aylarda 28'de takili kalirdi.
      const di = new Date(g(ilk)), dt = new Date(g(tarih));
      let k = (dt.getUTCFullYear() - di.getUTCFullYear()) * 12
            + dt.getUTCMonth() - di.getUTCMonth();
      while (g(ayEkle(ilk, k)) > g(tarih)) k--;
      while (g(ayEkle(ilk, k + 1)) <= g(tarih)) k++;
      return { bas: ayEkle(ilk, k), bitis: ayEkle(ilk, k + 1) };
    }
    if (donem.tip === "semimonthly") {
      // Ayin 1'i ve 15'i
      const d = new Date(g(tarih));
      const yil = d.getUTCFullYear(), ay = d.getUTCMonth(), gun = d.getUTCDate();
      if (gun < 15) {
        return { bas: m(Date.UTC(yil, ay, 1)), bitis: m(Date.UTC(yil, ay, 15)) };
      }
      return { bas: m(Date.UTC(yil, ay, 15)), bitis: m(Date.UTC(yil, ay + 1, 1)) };
    }
    throw new Error("bilinmeyen donem tipi: " + donem.tip);
  }

  /** Ardisik n donem. Testte "bosluksuz doseme" ozdesligi icin. */
  function donemler(donem, baslangic, adet) {
    const liste = [];
    let t = baslangic;
    for (let i = 0; i < adet; i++) {
      const a = donemAraligi(donem, t);
      liste.push(a);
      t = a.bitis;
    }
    return liste;
  }

  // ---------------------------------------------------------------- faturalar

  /** Aralik icinde vadesi gelen, HENUZ ODENMEMIS faturalar.
   *  Fatura aylik tekrar eder; vadeGunu ayin gunudur (1-31).
   *  Ayin 31'i olmayan aylarda ayin son gunune kayar. */
  function vadesiGelenFaturalar(faturalar, aralik) {
    const cikti = [];
    for (const f of faturalar) {
      for (const vade of faturaVadeleri(f, aralik)) {
        if (!(f.odendi || []).includes(vade)) {
          cikti.push({ id: f.id, ad: f.ad, kurus: f.kurus, vade: vade });
        }
      }
    }
    return cikti.sort((a, b) => g(a.vade) - g(b.vade));
  }

  /** Bir faturanin [bas, bitis) icine dusen TUM vadeleri (odenmis olsa da).
   *  Sikliklar: monthly (varsayilan, vadeGunu), weekly/biweekly (ilkVade'den
   *  7/14 gun adimi), yearly (ilkVade'nin ay+gunu; 29 Subat -> 28 Subat). */
  function faturaVadeleri(f, aralik) {
    const tip = f.sikilik || "monthly";
    const bas = g(aralik.bas), bit = g(aralik.bitis);
    const vadeler = [];
    if (tip === "weekly" || tip === "biweekly") {
      const adim = tip === "weekly" ? 7 : 14;
      // ilkVade'den ONCE vade yok: fatura o gun baslar (gecmise dogru uzatilmaz)
      const k = Math.max(0, Math.floor(gunFarki(f.ilkVade, aralik.bas) / adim));
      for (let v = gunEkle(f.ilkVade, k * adim); g(v) < bit; v = gunEkle(v, adim)) {
        if (g(v) >= bas) vadeler.push(v);
      }
    } else if (tip === "yearly") {
      const ay = new Date(g(f.ilkVade)).getUTCMonth();
      const gun = new Date(g(f.ilkVade)).getUTCDate();
      const y0 = new Date(bas).getUTCFullYear(), y1 = new Date(bit).getUTCFullYear();
      for (let y = y0; y <= y1; y++) {
        const sonGun = new Date(Date.UTC(y, ay + 1, 0)).getUTCDate();
        const v = m(Date.UTC(y, ay, Math.min(gun, sonGun)));
        if (g(v) >= bas && g(v) < bit && g(v) >= g(f.ilkVade)) vadeler.push(v);
      }
    } else {
      // Araligin ilk ayindan sonuna kadar HER ay (aralik kac ay olursa olsun)
      const a0 = new Date(bas), a1 = new Date(bit);
      const aySayisi = (a1.getUTCFullYear() - a0.getUTCFullYear()) * 12
                     + a1.getUTCMonth() - a0.getUTCMonth();
      for (let k = 0; k <= aySayisi; k++) {
        const y = a0.getUTCFullYear(), ay = a0.getUTCMonth() + k;
        const sonGun = new Date(Date.UTC(y, ay + 1, 0)).getUTCDate();
        const v = m(Date.UTC(y, ay, Math.min(f.vadeGunu, sonGun)));
        if (g(v) >= bas && g(v) < bit) vadeler.push(v);
      }
    }
    return vadeler;
  }

  // ---------------------------------------------------------------- zarflar

  /** Bu donemde zarflara ayrilacak toplam. Hedefine ulasmis zarf para istemez. */
  function zarfTahsisi(zarflar) {
    let toplam = 0;
    for (const z of zarflar) {
      const kalan = Math.max(0, (z.hedefKurus || 0) - (z.birikmisKurus || 0));
      toplam += Math.min(z.donemBasiKurus || 0, kalan);
    }
    return toplam;
  }

  // ---------------------------------------------------------------- safe to spend

  /** Guvenli harcanabilir = bakiye - vadesi gelen odenmemis faturalar - zarf tahsisi - tampon
   *
   *  Urunun tek sayisi bu. Negatif cikabilir ve cikmalidir: alici acigi
   *  gormeli, gizlenmemeli. */
  function guvenliHarcanabilir(durum, bugun) {
    const aralik = donemAraligi(durum.donem, bugun);
    const faturalar = vadesiGelenFaturalar(durum.faturalar || [], aralik);
    const faturaToplam = faturalar.reduce((t, f) => t + f.kurus, 0);
    const zarf = zarfTahsisi(durum.zarflar || []);
    const tampon = Math.max(0, durum.tamponKurus || 0);
    // "toplam" modu: banka bakiyesi girilmez; kaynak = maas + bu donemde kaydedilen tum hareketler (gelir +, gider −, odenen fatura −)
    const mod = durum.hesapModu === "toplam" ? "toplam" : "bakiye";
    const kaynak = mod === "toplam"
      ? (durum.maasKurus || 0) + (durum.hareketler || []).reduce((t, h) => (h.tarih >= aralik.bas && h.tarih < aralik.bitis ? t + h.kurus : t), 0)
      : (durum.bakiyeKurus || 0);
    const guvenli = kaynak - faturaToplam - zarf - tampon;
    const kalanGun = gunFarki(bugun, aralik.bitis);
    return {
      aralik: aralik,
      bakiyeKurus: kaynak,
      mod: mod,
      faturaKurus: faturaToplam,
      zarfKurus: zarf,
      tamponKurus: tampon,
      guvenliKurus: guvenli,
      faturaListesi: faturalar,
      kalanGun: kalanGun,
      gunlukKurus: gunlukPay(guvenli, kalanGun),
    };
  }

  /** Gunluk pay: guvenli tutarin kalan gunlere asagi yuvarlanmis bolumu.
   *  Negatif ya da sifir guvenli tutarda 0 (alici "eksi gunluk" gormez; eksiyi
   *  ana sayi zaten gosterir). Hicbir zaman guvenli tutari asmaz. */
  function gunlukPay(guvenliKurus, kalanGun) {
    if (!(guvenliKurus > 0) || !(kalanGun > 0)) return 0;
    return Math.floor(guvenliKurus / kalanGun);
  }

  // ---------------------------------------------------------------- guven etiketi

  /** Bakiyenin ne kadar guncel oldugunu dürüstce söyler.
   *  "fresh": bugün/dün dogrulandi; "guess": 2-4 gun; "fuzzy": 5+ gun ya da hic.
   *  Ayrica kac gun gectigini doner ki ekran "checked 3 days ago" diyebilsin. */
  function guvenSeviyesi(durum, bugun) {
    if (durum.hesapModu === "toplam") return { seviye: "guess", gun: null, mod: "toplam" }; // bakiye girilmedi: en fazla "iyi tahmin"
    if (!durum.bakiyeTarihi) return { seviye: "fuzzy", gun: null };
    const gun = Math.max(0, gunFarki(durum.bakiyeTarihi, bugun));
    return { seviye: gun <= 1 ? "fresh" : gun <= 4 ? "guess" : "fuzzy", gun: gun };
  }

  /** Son etkinlik: bakiye dogrulama ya da son hareket, hangisi yeniyse. */
  function sonEtkinlik(durum) {
    let son = durum.bakiyeTarihi || null;
    for (const h of durum.hareketler || []) if (!son || h.tarih > son) son = h.tarih;
    return son;
  }

  /** "Welcome back" karti: 3+ gun hicbir sey girilmediyse. Hic etkinlik yoksa
   *  (yeni kurulum) kart cikmaz: karsilanacak bir "geri" yok. */
  function donusKartiGerekli(durum, bugun) {
    const son = sonEtkinlik(durum);
    return !!son && gunFarki(son, bugun) >= 3;
  }

  // ---------------------------------------------------------------- geri al

  const GERI_SINIR = 30;

  /** Geri al yigini METIN anlik goruntuleri tutar (disaAktar ciktisi): sonradan
   *  durum degisse bile eski goruntu degismez. Yigin degismez dizi gibi
   *  kullanilir; her islem yeni dizi doner. */
  function geriyeAl(yigin, durum) {
    const yeni = yigin.concat([disaAktar(durum)]);
    return yeni.length > GERI_SINIR ? yeni.slice(yeni.length - GERI_SINIR) : yeni;
  }

  /** Son goruntuyu geri yukler: {durum, yigin} ya da yigin bossa null. */
  function geriAl(yigin) {
    if (!yigin.length) return null;
    const son = yigin[yigin.length - 1];
    const d = iceAktar(son);
    delete d.surum;
    return { durum: d, yigin: yigin.slice(0, -1) };
  }

  // ---------------------------------------------------------------- hareketler

  function kategoriToplamlari(hareketler) {
    const t = {};
    for (const h of hareketler) t[h.kategori] = (t[h.kategori] || 0) + h.kurus;
    return t;
  }

  /** Para korunumu: acilis + gelir - gider == kapanis.
   *  Hareket kurusu pozitifse gelir, negatifse giderdir. */
  function bakiyeAkisi(acilisKurus, hareketler) {
    let gelir = 0, gider = 0;
    for (const h of hareketler) {
      if (h.kurus >= 0) gelir += h.kurus;
      else gider += -h.kurus;
    }
    return {
      acilisKurus: acilisKurus,
      gelirKurus: gelir,
      giderKurus: gider,
      kapanisKurus: acilisKurus + gelir - gider,
    };
  }

  // ---------------------------------------------------------------- borc

  /** Borc kartopu (snowball: kucuk bakiye once) / cig (avalanche: yuksek faiz once).
   *
   *  Aylik faiz = bakiye * yillikOran / 12, tam sayiya yuvarlanir.
   *  Donus: {aylar:[{ay, odemeler:[{id,kurus}], faizKurus, kalanKurus}], toplam...}
   *  Sonsuz donguye karsi ust sinir var: asgari odemeler faizi karsilamiyorsa
   *  plan "kapanmaz" isaretiyle doner - sessizce yanlis sayi uretmez. */
  function borcPlani(borclar, ekOdemeKurus, yontem, enFazlaAy) {
    enFazlaAy = enFazlaAy || 600;
    const kalan = borclar.map((b) => ({
      id: b.id, ad: b.ad, kurus: b.bakiyeKurus,
      oran: b.yillikOran || 0, asgari: b.asgariKurus || 0,
    }));
    const aylar = [];
    let toplamFaiz = 0, toplamOdeme = 0;

    for (let ay = 1; ay <= enFazlaAy; ay++) {
      const acik = kalan.filter((b) => b.kurus > 0);
      if (!acik.length) break;

      let faizBu = 0;
      for (const b of acik) {
        const faiz = Math.round(b.kurus * b.oran / 12);
        b.kurus += faiz;
        faizBu += faiz;
      }
      toplamFaiz += faizBu;

      acik.sort(yontem === "avalanche"
        ? (x, y) => y.oran - x.oran || x.kurus - y.kurus
        : (x, y) => x.kurus - y.kurus || y.oran - x.oran);

      let butce = acik.reduce((t, b) => t + b.asgari, 0) + ekOdemeKurus;
      const odemeler = [];
      // Once asgariler, sonra artan tutar hedef borca
      for (const b of acik) {
        const ode = Math.min(b.asgari, b.kurus, butce);
        b.kurus -= ode; butce -= ode;
        if (ode > 0) odemeler.push({ id: b.id, kurus: ode });
      }
      for (const b of acik) {
        if (butce <= 0) break;
        const ode = Math.min(butce, b.kurus);
        if (ode <= 0) continue;
        b.kurus -= ode; butce -= ode;
        const v = odemeler.find((o) => o.id === b.id);
        if (v) v.kurus += ode; else odemeler.push({ id: b.id, kurus: ode });
      }
      const odemeBu = odemeler.reduce((t, o) => t + o.kurus, 0);
      toplamOdeme += odemeBu;
      aylar.push({
        ay: ay, odemeler: odemeler, faizKurus: faizBu,
        kalanKurus: kalan.reduce((t, b) => t + b.kurus, 0),
      });
      if (odemeBu === 0) break; // ilerleme yok: sonsuz donguyu kes
    }

    const kapandi = kalan.every((b) => b.kurus === 0);
    return {
      aylar: aylar,
      kapandi: kapandi,
      ayAdedi: aylar.length,
      toplamFaizKurus: toplamFaiz,
      toplamOdemeKurus: toplamOdeme,
      anaparaKurus: borclar.reduce((t, b) => t + b.bakiyeKurus, 0),
      kalanKurus: kalan.reduce((t, b) => t + b.kurus, 0),
    };
  }

  // ---------------------------------------------------------------- tutar metni

  /** Kullanicinin yazdigi tutari kurus tamsayiya cevirir; gecersizse null.
   *  Kayan nokta yok: metin parcalanir. Son ayirac 1-2 haneli kesirse
   *  ondaliktir ("12,50", "1.234,56", "1,234.56"); 3 haneliyse binliktir. */
  function kurusAyristir(metin) {
    let s = String(metin == null ? "" : metin).trim().replace(/\s/g, "");
    s = s.replace(/^[^\d.,\-−]+/, ""); // basta para simgesi
    let eksi = false;
    if (s[0] === "-" || s[0] === "−") { eksi = true; s = s.slice(1); }
    if (!s) return null;
    let tam, kesir = "";
    const kes = s.match(/^(.*?)([.,])(\d{1,2})$/);
    if (/^\d+$/.test(s)) {
      tam = s;
    } else if (kes) {
      // Ondalik: tam kisim ya duz rakam ya da OTEKI ayracla 3'erli gruplu
      const t = kes[1];
      const grup = new RegExp("^\\d{1,3}(\\" + (kes[2] === "." ? "," : ".") + "\\d{3})+$");
      if (!(t === "" || /^\d+$/.test(t) || grup.test(t))) return null;
      tam = t.replace(/[.,]/g, "");
      kesir = kes[3];
    } else if (/^\d{1,3}([.,]\d{3}){2,}$/.test(s)
               && new Set(s.match(/[.,]/g)).size === 1) {
      tam = s.replace(/[.,]/g, ""); // 1,234,567: yalniz birden fazla grup belirsiz degil
    } else {
      return null; // "5.999", "1.2.3", "1,,2": belirsiz ya da bozuk
    }
    if (tam === "" && kesir === "") return null;
    if (tam.length > 12) return null;
    const kurus = Number(tam || "0") * 100 + Number((kesir + "00").slice(0, 2));
    return eksi ? -kurus : kurus;
  }

  /** Kurusu "1,234.50" metnine cevirir (isaret basta, simge yok). */
  function kurusMetni(kurus) {
    const mutlak = Math.abs(kurus);
    const tam = Math.floor(mutlak / 100);
    const kesir = String(mutlak % 100).padStart(2, "0");
    const grup = String(tam).replace(/\B(?=(\d{3})+(?!\d))/g, ",");
    return (kurus < 0 ? "-" : "") + grup + "." + kesir;
  }

  // ---------------------------------------------------------------- dogrulama

  const SINIR = 100000000000000; // 1e14 kurus: guvenli tamsayi sinirinin cok altinda

  function kurusMu(x) { return Number.isSafeInteger(x) && Math.abs(x) <= SINIR; }
  function tarihMi(x) {
    return typeof x === "string" && /^\d{4}-\d{2}-\d{2}$/.test(x) && m(g(x)) === x;
  }

  /** Yuklenen/ice aktarilan durumun sekli ve turleri dogru mu?
   *  Donus: null (gecerli) ya da ilk hatanin yolu ("faturalar[0].kurus").
   *  Boylece bozuk bir yedek hesaba hic girmez; metin+sayi toplama, NaN,
   *  kesirli kurus gibi sessiz yanlis rakamlar uretilmez. */
  /** v2 alanlari: bozuk ya da elle duzenlenmis yedek ekrani cokertmesin / sessiz yanlis rakam uretmesin.
   *  Alan yoksa serbest (eski yedekler); varsa tur ve para alanlari dogru olmali. */
  const PARA_ALANLARI = ["kurus", "limitKurus", "hedefKurus", "birikmisKurus", "donemBasiKurus", "bakiyeKurus", "asgariKurus", "taksitKurus"];
  const DIZI_ALANLARI = ["hesaplar", "kategoriler", "gelirler", "maaslar", "hedefler", "meydanOkumalar", "borclar", "gorevler", "beyin", "rutinler", "bekleme", "geriGelen", "kilometre", "hizliDugmeler", "borcOdemeleri", "skorlar", "abonelikler", "kartlar"];
  /** Kisisellestirme (v2/kisisel): ad <= 30, cumle <= 90, rozet <= 24, emoji <= 8 karakter (kod noktasi), hizali orta|sol.
   *  Alan yoksa serbest (eski yedekler). Kontrol karakteri / satir sonu yok. Metin her zaman duz metin olarak cizilir (textContent). */
  const KISISEL_SINIR = { ad: 30, cumle: 90, rozet: 24, emoji: 8 };
  const VURGULAR = ["tema", "gul", "mercan", "bal", "yaprak", "deniz", "murdum"]; // ayarlar.vurgu: "tema" = temanin kendi rengi
  function kisiselHatasi(d) {
    const k = d.kisisel;
    if (k !== undefined) {
      if (!k || typeof k !== "object" || Array.isArray(k)) return "kisisel";
      for (const alan of Object.keys(KISISEL_SINIR)) {
        const v = k[alan];
        if (v === undefined) continue;
        if (typeof v !== "string" || /[\u0000-\u001f\u007f\u2028\u2029]/.test(v) || Array.from(v).length > KISISEL_SINIR[alan] || v.length > KISISEL_SINIR[alan] * 2) return "kisisel." + alan;
      }
      if (k.hizali !== undefined && ["orta", "sol"].indexOf(k.hizali) < 0) return "kisisel.hizali";
    }
    const a = d.ayarlar;
    if (a && typeof a === "object") {
      if (a.vurgu !== undefined && VURGULAR.indexOf(a.vurgu) < 0) return "ayarlar.vurgu";
      if (a.azHareket !== undefined && typeof a.azHareket !== "boolean") return "ayarlar.azHareket";
      if (a.yogunluk !== undefined && ["rahat", "sik"].indexOf(a.yogunluk) < 0) return "ayarlar.yogunluk";
      if (a.kisiselIpucu !== undefined && typeof a.kisiselIpucu !== "boolean") return "ayarlar.kisiselIpucu";
    }
    return null;
  }
  function yeniAlanHatasi(d) {
    const kh = kisiselHatasi(d); if (kh) return kh;
    for (const ad of DIZI_ALANLARI) {
      if (d[ad] === undefined) continue;
      if (!Array.isArray(d[ad])) return ad;
      for (let i = 0; i < d[ad].length; i++) {
        const x = d[ad][i], yol = ad + "[" + i + "]";
        if (ad === "kilometre") { if (typeof x !== "string") return yol; continue; }
        if (!x || typeof x !== "object" || Array.isArray(x)) return yol;
        if (typeof x.id !== "string") return yol + ".id";
        for (const f of PARA_ALANLARI) if (x[f] !== undefined && !kurusMu(x[f])) return yol + "." + f;
        if (x.yillikOran !== undefined && !(typeof x.yillikOran === "number" && x.yillikOran >= 0 && x.yillikOran <= 1)) return yol + ".yillikOran";
        if (ad === "hesaplar" && typeof x.sayilir !== "boolean") return yol + ".sayilir";
        if (ad === "borclar" && x.tur !== undefined && ["card", "student", "auto", "mortgage", "personal", "other"].indexOf(x.tur) < 0) return yol + ".tur";
        if (ad === "borcOdemeleri" && !(tarihMi(x.tarih) && typeof x.borcId === "string" && kurusMu(x.kurus) && x.kurus > 0)) return yol + ".odeme";
        if (ad === "skorlar" && !(tarihMi(x.tarih) && Number.isInteger(x.puan) && x.puan >= 300 && x.puan <= 850)) return yol + ".skor";
        if (ad === "skorlar" && x.kaynak != null && (typeof x.kaynak !== "string" || x.kaynak.length > 40)) return yol + ".kaynak";
        if (ad === "borclar") { // borc urunu: kurallar borc.js ile ayni (bu dosya borc.js'ten once yuklenir; require yok, saf kod)
          if (x.bakiyeKurus === undefined || x.bakiyeKurus < 0) return yol + ".bakiyeKurus";

    return { a: a, b: b, fark: { gelirKurus: a.gelirKurus - b.gelirKurus, giderKurus: fg, netKurus: a.netKurus - b.netKurus },
      giderDegisimYuzde: b.giderKurus > 0 ? Math.sign(fg) * Math.round(Math.abs(fg) * 100 / b.giderKurus) : null, kategoriFark: kf };
  }

  /** Son `adet` ay (sonAy dahil, eskiden yeniye): [{ay, gelirKurus, giderKurus, netKurus}]. opt: rapor filtreleri (kategori, etiket...). */
  function trend(d, sonAy, adet, opt) {
    const e = dogrula(d); if (e) return e;
    if (!ayAnahtariMi(sonAy)) return { hata: "sonAy" };
    const n = adet == null ? 12 : adet;
    if (!Number.isInteger(n) || n < 1 || n > 120) return { hata: "adet" };
    const bas = B.ayEkle(sonAy + "-01", -(n - 1));
    const a = ayAraligi(Number(sonAy.slice(0, 4)), Number(sonAy.slice(5, 7)));
    const r = raporIc(d, Object.assign({}, opt || {}, { bas: bas, son: a.son }));
    if (r.hata) return r;
    return Object.keys(r.aya).map((k) => ({ ay: k, gelirKurus: r.aya[k].gelirKurus, giderKurus: r.aya[k].giderKurus, netKurus: r.aya[k].gelirKurus - r.aya[k].giderKurus }));
  }

  // ---------------------------------------------------------------- limit / tahmin
  function ayGunleri(a, bugun) {
    const gunSayisi = Number(a.son.slice(8));
    const gecen = bugun < a.bas ? 0 : bugun > a.son ? gunSayisi : Number(bugun.slice(8));
    return { gunSayisi: gunSayisi, gecenGun: gecen };
  }
  /** Kategori limitleri (ayin TAMAMINDAKI gider; ileri tarihli dahil):
   *  {ay, kalanGun (bugun dahil; ay gectiyse 0, baslamadiysa ayin gun sayisi), satirlar:[{kategori, limitKurus, harcananKurus,
   *   kalanKurus (eksi olabilir), yuzde (asagi yuvarlanmis, 100'u asabilir), seviye:"ok"(<80)|"near"(80..100, asmadi)|"over",
   *   gunlukPayKurus (kalan>0 ve kalanGun>0 ise taban(kalan/kalanGun), yoksa 0)}], toplam:{limitKurus, harcananKurus, kalanKurus}} */
  function limitDurumu(d, yil, ay, bugun) {
    const e = dogrula(d); if (e) return e;
    const a = ayAraligi(yil, ay); if (!a) return { hata: "ay" };
    if (!tarihMi(bugun)) return { hata: "bugun" };
    const r = raporIc(d, a), gunSayisi = Number(a.son.slice(8));
    const kalanGun = bugun < a.bas ? gunSayisi : bugun > a.son ? 0 : gunSayisi - Number(bugun.slice(8)) + 1; // bugun dahil
    const satirlar = (d.limitler || []).map((l) => {
      const h = r.kategoriye[l.kategori] ? r.kategoriye[l.kategori].giderKurus : 0, k = l.aylikKurus - h;
      const yuzde = Number(BigInt(h) * 100n / BigInt(l.aylikKurus));
      return { kategori: l.kategori, limitKurus: l.aylikKurus, harcananKurus: h, kalanKurus: k, yuzde: yuzde,
        seviye: h > l.aylikKurus ? "over" : yuzde >= 80 ? "near" : "ok", gunlukPayKurus: k > 0 && kalanGun > 0 ? Math.floor(k / kalanGun) : 0 };
    });
    const t = satirlar.reduce((s, x) => { s.limitKurus += x.limitKurus; s.harcananKurus += x.harcananKurus; s.kalanKurus += x.kalanKurus; return s; }, { limitKurus: 0, harcananKurus: 0, kalanKurus: 0 });
    return { ay: a.bas.slice(0, 7), kalanGun: kalanGun, satirlar: satirlar, toplam: t };
  }

  /** [bas, son] icinde henuz kaydi olmayan (duraklatilmamis, atla disi) tekrar girisleri: {gelirKurus, giderKurus}. */
  function bekleyenTekrar(d, bas, son) {
    const r = cift();
    if (son < bas) return r;
    const var_ = new Set();
    for (const h of d.hareketler) if (h.tekrarId !== undefined) var_.add(h.tekrarId + "|" + h.tekrarTarih);
    for (const t of d.tekrarlar || []) {
      if (t.duraklatildi || t.sablon.tur === "transfer") continue;
      const atla = new Set(t.atla || []);
      for (const tt of tekrarTarihleriIc(t, bas, son, 400) || []) {
        if (atla.has(tt) || var_.has(t.id + "|" + tt)) continue;
        r[t.sablon.tur === "income" ? "gelirKurus" : "giderKurus"] += t.sablon.kurus;
      }
    }
    return r;
  }
  /** Ay sonu tahmini (sakin ton: "about $X spent / $Y left"). Sabit tekrarlar (kira) ortalamaya katilip sisirilmez:
   *  gecenGun = ayin bugun DAHIL gecen gunleri (baslamadiysa 0, bittiyse ayin gun sayisi); kalanGun = gunSayisi - gecenGun.
   *  simdiyeKadarKurus = [ay basi, bugun] gideri = sabitKurus (tekrardan uretilmis ya da sabit:true) + degiskenKurus (digerleri).
   *  ileriTarihliGiderKurus = (bugun, ay sonu] icinde ZATEN girilmis giderler.
   *  bekleyenTekrarGiderKurus / bekleyenTekrarGelirKurus = (bugun, ay sonu] icinde henuz uretilmemis tekrarlar.
   *  gecikenTekrarGiderKurus / gecikenTekrarGelirKurus = [ay basi, bugun] icinde tarihi gelmis ama HENUZ kaydi olmayan
   *  tekrarlar (otomatik ekleme geri alindiysa): sessizce disarida kalmaz, ayri alanda tahmine girer.
   *  tahminiGiderKurus = simdiye + ileriTarihli + gecikenTekrarGider + bekleyenTekrarGider + yarimYukari(degisken * kalanGun / gecenGun)
   *  (gecenGun 0 ise null). gunlukOrtalamaKurus = yarimYukari(degisken / gecenGun) (yalniz gosterim; tahmin oranla).
   *  gelirKurus = ayin girilmis tum geliri + gecikenTekrarGelir + bekleyenTekrarGelir; tahminiKalanKurus = gelirKurus - tahminiGider (null olabilir).
   *  durum: "baslamadi"|"suruyor"|"bitti". */
  function tahmin(d, yil, ay, bugun) {
    const e = dogrula(d); if (e) return e;
    const a = ayAraligi(yil, ay); if (!a) return { hata: "ay" };
    if (!tarihMi(bugun)) return { hata: "bugun" };
    const g = ayGunleri(a, bugun), kalanGun = g.gunSayisi - g.gecenGun;
    const tum = raporIc(d, a), simdiSon = bugun > a.son ? a.son : bugun;
    let simdiye = 0, sabit = 0;
    if (g.gecenGun > 0) for (const h of d.hareketler) {
      if (h.tur !== "expense" || h.tarih < a.bas || h.tarih > simdiSon) continue;
      simdiye += h.kurus; if (h.tekrarId !== undefined || h.sabit === true) sabit += h.kurus;
    }
    const degisken = simdiye - sabit;
    const bek = bekleyenTekrar(d, bugun < a.bas ? a.bas : B.gunEkle(bugun, 1), a.son);
    const gec = g.gecenGun > 0 ? bekleyenTekrar(d, a.bas, simdiSon) : cift();
    const ileri = tum.giderKurus - simdiye;
    let tahmini = null, ort = 0;
    if (g.gecenGun > 0) {
      const gg = BigInt(g.gecenGun);
      tahmini = simdiye + ileri + gec.giderKurus + bek.giderKurus + Number(yuvarla(BigInt(degisken) * BigInt(kalanGun), gg));
      ort = Number(yuvarla(BigInt(degisken), gg));
      if (!Number.isSafeInteger(tahmini)) return { hata: "tasma" };
    }
    const gelir = tum.gelirKurus + gec.gelirKurus + bek.gelirKurus;
    return { ay: a.bas.slice(0, 7), gunSayisi: g.gunSayisi, gecenGun: g.gecenGun, kalanGun: kalanGun,
      simdiyeKadarKurus: simdiye, sabitKurus: sabit, degiskenKurus: degisken, gunlukOrtalamaKurus: ort,
      ileriTarihliGiderKurus: ileri, bekleyenTekrarGiderKurus: bek.giderKurus, bekleyenTekrarGelirKurus: bek.gelirKurus,
      gecikenTekrarGiderKurus: gec.giderKurus, gecikenTekrarGelirKurus: gec.gelirKurus,
      tahminiGiderKurus: tahmini, gelirKurus: gelir, tahminiKalanKurus: tahmini === null ? null : gelir - tahmini,
      durum: g.gecenGun === 0 ? "baslamadi" : bugun > a.son ? "bitti" : "suruyor" };
  }

  /** Karsilastirma araliklari (Reports "Compared with before"). bas..son secili donem, ayAdet: takvim ayi sayisi (ay/3 ay/yil;
   *  0 = ozel aralik). Donem SURUYORSA (bas <= bugun < son) iki taraf da "bugune kadar" ayni uzunlukta kesilir:
   *  a = [bas, bugun], b = onceki donemin ayni gunleri (ay donemi: ayEkle(bugun, -ayAdet), onceki donemin sonunu gecmez;
   *  ozel: ayni gun sayisi). Surmuyorsa a = tum donem, b = onceki esdeger donem (ay: onceki ayAdet ay; ozel: ayni uzunluk).
   *  -> {a:{bas, son}, b:{bas, son}, kismi} | {hata}. */
  function kiyasAraligi(bas, son, bugun, ayAdet) {
    if (!tarihMi(bas) || !tarihMi(son) || son < bas) return { hata: "aralik" };
    if (!tarihMi(bugun)) return { hata: "bugun" };
    const n = ayAdet == null ? 0 : ayAdet;
    if (!Number.isInteger(n) || n < 0 || n > 120) return { hata: "ayAdet" };
    const kismi = bas <= bugun && bugun < son, aSon = kismi ? bugun : son, os = B.gunEkle(bas, -1);
    let ob, bSon;
    if (n > 0) {
      ob = B.ayEkle(bas, -n);
      bSon = kismi ? B.ayEkle(aSon, -n) : os;
      if (bSon > os) bSon = os;
      if (bSon < ob) bSon = ob;
    } else {
      const uz = B.gunFarki(bas, aSon) + 1;
      ob = B.gunEkle(bas, -uz); bSon = os;
    }
    return { a: { bas: bas, son: aSon }, b: { bas: ob, son: bSon }, kismi: kismi };
  }

  // ---------------------------------------------------------------- hedefler
  function haftaBasi(t) { const gun = new Date(B.g(t)).getUTCDay(); return B.gunEkle(t, -((gun + 6) % 7)); } // Pazartesi
  function hedefAraligi(donem, bugun) {
    if (donem === "weekly") { const b = haftaBasi(bugun); return { bas: b, son: B.gunEkle(b, 6) }; }
    if (donem === "monthly") return ayAraligi(Number(bugun.slice(0, 4)), Number(bugun.slice(5, 7)));
    return yilAraligi(Number(bugun.slice(0, 4)));
  }
  /** Bugunu iceren donemde hedefler (hafta Pazartesi baslar):
   *  [{id, ad, olcu, donem, kategori|null, bas, son, hedefKurus, gercekKurus, yuzde (taban, gercek<0 ise 0), tamamMi}]
   *  expense: harcama tavani (tamamMi = gercek <= hedef); income/net: ulasilacak tutar (tamamMi = gercek >= hedef). */
  function hedefDurumu(d, bugun) {
    const e = dogrula(d); if (e) return e;
    if (!tarihMi(bugun)) return { hata: "bugun" };
    return (d.hedefler || []).map((h) => {
      const a = hedefAraligi(h.donem, bugun), r = raporIc(d, Object.assign({}, a, h.kategori !== undefined ? { kategori: h.kategori } : {}));
      const gercek = h.olcu === "income" ? r.gelirKurus : h.olcu === "expense" ? r.giderKurus : r.netKurus;
      return { id: h.id, ad: h.ad, olcu: h.olcu, donem: h.donem, kategori: h.kategori === undefined ? null : h.kategori, bas: a.bas, son: a.son,
        hedefKurus: h.hedefKurus, gercekKurus: gercek, yuzde: gercek > 0 ? Number(BigInt(gercek) * 100n / BigInt(h.hedefKurus)) : 0,
        tamamMi: h.olcu === "expense" ? gercek <= h.hedefKurus : gercek >= h.hedefKurus };
    });
  }

  // ---------------------------------------------------------------- tekrarlar
  function ayFarki(a, b) { return (Number(b.slice(0, 4)) - Number(a.slice(0, 4))) * 12 + Number(b.slice(5, 7)) - Number(a.slice(5, 7)); }
  function nTarih(ilk, sik, n) { return GUN_ADIM[sik] ? B.gunEkle(ilk, n * GUN_ADIM[sik]) : B.ayEkle(ilk, n * AY_ADIM[sik]); }
  /** [bas, son] (dahil) icindeki tekrar tarihleri; limit asilirsa null. */
  function tekrarTarihleriIc(t, bas, son, limit) {
    const ust = t.bitis !== undefined && t.bitis < son ? t.bitis : son, alt = bas > t.ilk ? bas : t.ilk, r = [];
    if (ust < alt) return r;
    const sik = t.sikilik;
    let n = GUN_ADIM[sik] ? Math.floor(B.gunFarki(t.ilk, alt) / GUN_ADIM[sik]) - 1 : Math.floor(ayFarki(t.ilk, alt) / AY_ADIM[sik]) - 1;
    for (n = Math.max(0, n); ; n++) {
      const tt = nTarih(t.ilk, sik, n);
      if (tt > ust) break;
      if (tt < alt) continue;
      r.push(tt);
      if (r.length > limit) return null;
    }
    return r;
  }
  /** Bir tekrarin [bas, son] icindeki tarihleri (duraklatma/atla UYGULANMAZ; takvim gosterimi). -> [tarih] | {hata} */
  function tekrarTarihleri(t, bas, son) {
    const h = tekrarHatasi(t, null); if (h !== null) return { hata: h || "tekrar" };
    if (!tarihMi(bas) || !tarihMi(son)) return { hata: "aralik" };
    return tekrarTarihleriIc(t, bas, son, MAKS.uretim) || { hata: "tasma" };
  }
  /** bugunden SONRAKI ilk tekrar tarihi (duraklatilmis ya da bitmisse null). Gecersiz -> null. */
  function tekrarSonraki(t, bugun) {
    if (tekrarHatasi(t, null) !== null || !tarihMi(bugun) || t.duraklatildi) return null;
    const atla = new Set(t.atla || []);
    let bas = B.gunEkle(bugun, 1);
    for (let i = 0; i < 40; i++) {
      const son = B.ayEkle(bas, 12), l = tekrarTarihleriIc(t, bas, son, 1000) || [];
      for (const x of l) if (!atla.has(x)) return x;
      if (t.bitis !== undefined && son >= t.bitis) return null;
      bas = B.gunEkle(son, 1);
    }
    return null;
  }
  function kopyaHareket(h) {
    const y = Object.assign({}, h);
    if (h.etiketler) y.etiketler = h.etiketler.slice();
    if (h.bolumler) y.bolumler = h.bolumler.map((b) => ({ kategori: b.kategori, kurus: b.kurus }));
    return y;
  }
  function tekrarUretIc(d, bugun) {
    const var_ = new Set(), idler = new Set(d.hareketler.map((h) => h.id)), cikti = [];
    for (const h of d.hareketler) if (h.tekrarId !== undefined) var_.add(h.tekrarId + "|" + h.tekrarTarih);
    for (let i = 0; i < (d.tekrarlar || []).length; i++) {
      const t = d.tekrarlar[i];
      if (t.duraklatildi) continue;
      const tarihler = tekrarTarihleriIc(t, t.ilk, bugun, MAKS.uretim);
      if (tarihler === null) return { hata: "tekrarlar[" + i + "].tasma" };
      const atla = new Set(t.atla || []);
      for (const tt of tarihler) {
        if (atla.has(tt) || var_.has(t.id + "|" + tt)) continue;
        let id = "r-" + t.id + "-" + tt, k = 2;
        while (idler.has(id)) id = "r-" + t.id + "-" + tt + "-" + (k++);
        idler.add(id);
        const h = kopyaHareket(t.sablon);
        h.id = id; h.tarih = tt; h.tekrarId = t.id; h.tekrarTarih = tt;
        cikti.push(h);
        if (cikti.length > MAKS.uretim) return { hata: "tasma" };
      }
    }
    return cikti.sort((x, y) => sirala(x.tarih, y.tarih));
  }
  /** Tarihi gelmis (bugun dahil) ama kaydi olmayan tekrar girisleri (oneri; durum degismez): [hareket] | {hata}.
   *  Duraklatilmis tekrar, atla listesi ve zaten uretilmis (tekrarId+tekrarTarih) tarihler atlanir. Tarihe gore sirali.
   *  id = "r-<tekrarId>-<tarih>" (cakisirsa "-2", "-3"...). */
  function tekrarUret(d, bugun) {
    const e = dogrula(d); if (e) return e;
    if (!tarihMi(bugun)) return { hata: "bugun" };
    return tekrarUretIc(d, bugun);
  }
  /** Eksikleri ekler ("Added 3 recurring entries"): {durum, eklenen:[id], adet} | {hata}. Undo: hareketleriKaldir(durum, eklenen). */
  function tekrarUygula(d, bugun) {
    const l = tekrarUret(d, bugun);
    if (!Array.isArray(l)) return l;
    const y = Object.assign({}, d, { hareketler: d.hareketler.concat(l) });
    const e = dogrula(y); if (e) return e;
    return { durum: y, eklenen: l.map((h) => h.id), adet: l.length };
  }
  /** Duraklat: {duraklatildi:true, duraklatildiTarih:bugun}. Zaten duraklatilmissa degismez. -> {durum} | {hata:"id"|"bugun"} */
  function tekrarDuraklat(d, id, bugun) {
    const e = dogrula(d); if (e) return e;
    if (!tarihMi(bugun)) return { hata: "bugun" };
    const t = (d.tekrarlar || []).find((x) => x.id === id);
    if (!t) return { hata: "id" };
    if (t.duraklatildi) return { durum: d };
    return kayitKoy(d, "tekrarlar", Object.assign({}, t, { duraklatildi: true, duraklatildiTarih: bugun }), "id");
  }
  /** Devam: duraklatma donemi [duraklatildiTarih (yoksa ilk), bugun) icindeki HENUZ kaydi olmayan tarihler atla'ya yazilir;
   *  boylece tekrarUret/"Fill missing" duraklatilan aylari gider/gelir olarak yazmaz. Bugun ve sonrasi normal devam eder.
   *  -> {durum, atlanan:[tarih]} | {hata:"id"|"bugun"|"tasma"} */
  function tekrarDevam(d, id, bugun) {
    const e = dogrula(d); if (e) return e;
    if (!tarihMi(bugun)) return { hata: "bugun" };
    const t = (d.tekrarlar || []).find((x) => x.id === id);
    if (!t) return { hata: "id" };
    const y = Object.assign({}, t); delete y.duraklatildi; delete y.duraklatildiTarih;
    const atlanan = [];
    if (t.duraklatildi) {
      const bas = t.duraklatildiTarih !== undefined && t.duraklatildiTarih > t.ilk ? t.duraklatildiTarih : t.ilk, son = B.gunEkle(bugun, -1);
      if (son >= bas) {
        const l = tekrarTarihleriIc(t, bas, son, MAKS.uretim);
        if (l === null) return { hata: "tasma" };
        const var_ = new Set(), atla = new Set(t.atla || []);
        for (const h of d.hareketler) if (h.tekrarId === t.id) var_.add(h.tekrarTarih);
        for (const x of l) if (!atla.has(x) && !var_.has(x)) atlanan.push(x);
        if (atlanan.length) y.atla = (t.atla || []).concat(atlanan).sort();
      }
    }
    const r = kayitKoy(d, "tekrarlar", y, "id");
    return r.hata ? r : { durum: r.durum, atlanan: atlanan };
  }

  // ---------------------------------------------------------------- hareket islemleri (yeni durum doner)
  /** Girdi temizligi: etiketler kirpilir/kucuk harf/tekil (bos -> alan yok), bos not/kategori/bolumler -> alan yok,
   *  null/undefined alanlar silinir. Tutar donusturulmez (UI Butce.kurusAyristir ile kurus verir). */
  function temizle(h) {
    const y = {};
    for (const k of Object.keys(h)) if (h[k] !== undefined && h[k] !== null) y[k] = h[k];
    if (Array.isArray(y.etiketler)) {
      const g = [];
      for (const x of y.etiketler) { const s = typeof x === "string" ? x.trim().toLowerCase().replace(/^#/, "") : x; if (s !== "" && g.indexOf(s) < 0) g.push(s); }
      if (g.length) y.etiketler = g; else delete y.etiketler;
    }
    if (typeof y.not === "string" && y.not.trim() === "") delete y.not;
    if (y.kategori === "") delete y.kategori;
    if (y.sabit === false) delete y.sabit;
    if (Array.isArray(y.bolumler)) { if (y.bolumler.length) y.bolumler = y.bolumler.map((b) => (nesneMi(b) ? { kategori: b.kategori, kurus: b.kurus } : b)); else delete y.bolumler; }
    return y;
  }
  function hesapIdleri(d) { return new Set(d.hesaplar.map((x) => x.id)); }
  /** {durum, hareket} | {hata:"hareket.alan"|"hareket.id" (var)}. */
  function hareketEkle(d, h) {
    const e = dogrula(d); if (e) return e;
    if (!nesneMi(h)) return { hata: "hareket" };
    const y = temizle(h);
    const he = hareketHatasi(y, hesapIdleri(d), false);
    if (he !== null) return { hata: he ? "hareket." + he : "hareket" };
    if (d.hareketler.some((x) => x.id === y.id)) return { hata: "hareket.id" };
    if (y.tekrarId !== undefined) return { hata: "hareket.tekrarId" }; // uretilen kayitlar yalniz tekrarUygula ile
    const yeni = Object.assign({}, d, { hareketler: d.hareketler.concat([y]) });
    const e2 = dogrula(yeni); if (e2) return e2;
    return { durum: yeni, hareket: y };
  }
  /** Toplu ekleme (CSV): atomik. opt.cakisma: "hata" (varsayilan; ayni id -> {hata:"liste[i].id"}) | "atla" (var olan id atlanir).
   *  -> {durum, eklenen:[id], atlanan:[id]} | {hata:"liste[i].alan"}. */
  function hareketlerEkle(d, liste, opt) {
    const e = dogrula(d); if (e) return e;
    if (!Array.isArray(liste)) return { hata: "liste" };
    const atlaMi = opt && opt.cakisma === "atla", ids = new Set(d.hareketler.map((x) => x.id)), hs = hesapIdleri(d), ek = [], atlanan = [];
    for (let i = 0; i < liste.length; i++) {
      if (!nesneMi(liste[i])) return { hata: "liste[" + i + "]" };

    if (!Number.isInteger(adet) || adet < 0) return { hata: "n" };
    const r = [];
    for (const h of araIc(d, "", { tur: tur || "expense" })) for (const p of parcalar(h)) if (r.indexOf(p.kategori) < 0) r.push(p.kategori);
    for (const k of d.kategoriler || []) if (k.tur === (tur || "expense") && r.indexOf(k.id) < 0) r.push(k.id);
    return r.slice(0, adet);
  }
  /** "Same as last time": bugun ya da ONCESINDEKI en son (tarih, sonra girilis) hareketin kopyasi (ileri tarihli pesin
   *  kayitlar secilmez), tarih = bugun, id/tekrar/sabit alanlari YOK.
   *  opt: {tur (varsayilan expense), kategori}. Bulunamaz ya da gecersizse null. */
  function ayniSonKez(d, bugun, opt) {
    if (dogrula(d) || !tarihMi(bugun)) return null;
    const o = opt || {};
    const l = araIc(d, "", { tur: o.tur || "expense", kategori: o.kategori == null ? null : o.kategori, son: bugun });
    if (!l.length) return null;
    const y = kopyaHareket(l[0]);
    delete y.id; delete y.tekrarId; delete y.tekrarTarih; delete y.sabit;
    y.tarih = bugun;
    return y;
  }

  // ---------------------------------------------------------------- aylik degerlendirme
  /** {ay, gelirKurus, giderKurus, netKurus, enBuyuk:[{kategori, kurus}] (en buyuk 3 gider kategorisi), onceki:{ay, gelirKurus,
   *   giderKurus, netKurus, bas, son}, fark:{gelirKurus, giderKurus, netKurus} (bu - onceki), kismi, bu:{bas, son, gelir/gider/net},
   *   cevaplar:[...]|null}. bugun verilir ve ay suruyorsa (kiyasAraligi) kiyas "bugune kadar": bu = [ay basi, bugun],
   *   onceki = onceki ayin ayni gunleri; fark bunlardan. Ust alanlar (gelirKurus...) her zaman ayin tamami. */
  function geriBakisOzeti(d, yil, ay, bugun) {
    const e = dogrula(d); if (e) return e;
    const a = ayAraligi(yil, ay); if (!a) return { hata: "ay" };
    if (bugun != null && !tarihMi(bugun)) return { hata: "bugun" };
    const oa = B.ayEkle(a.bas, -1), o0 = ayAraligi(Number(oa.slice(0, 4)), Number(oa.slice(5, 7)));
    // Suren ay (bugun verilmis, ayin icinde, son gun degil): kiyas iki tarafta da "bugune kadar" ayni gunler (kiyasAraligi).
    const k = bugun != null ? kiyasAraligi(a.bas, a.son, bugun, 1) : { kismi: false };
    const o = k.kismi ? k.b : o0;
    const r = raporIc(d, a), p = raporIc(d, o), rk = k.kismi ? raporIc(d, k.a) : r;
    const enBuyuk = Object.keys(r.kategoriye).filter((k) => r.kategoriye[k].giderKurus > 0)
      .map((k) => ({ kategori: k, kurus: r.kategoriye[k].giderKurus })).sort((x, y) => y.kurus - x.kurus || sirala(x.kategori, y.kategori)).slice(0, 3);
    const not = (d.geriBakislar || []).find((g) => g.ay === a.bas.slice(0, 7));
    return { ay: a.bas.slice(0, 7), gelirKurus: r.gelirKurus, giderKurus: r.giderKurus, netKurus: r.netKurus, enBuyuk: enBuyuk,
      kismi: !!k.kismi, bu: { bas: rk.bas, son: rk.son, gelirKurus: rk.gelirKurus, giderKurus: rk.giderKurus, netKurus: rk.netKurus },
      onceki: { ay: o.bas.slice(0, 7), bas: o.bas, son: o.son, gelirKurus: p.gelirKurus, giderKurus: p.giderKurus, netKurus: p.netKurus },
      fark: { gelirKurus: rk.gelirKurus - p.gelirKurus, giderKurus: rk.giderKurus - p.giderKurus, netKurus: rk.netKurus - p.netKurus },
      cevaplar: not ? not.cevaplar.slice() : null };
  }

  // ---------------------------------------------------------------- CSV
  /** Formul enjeksiyonu korumasi: = + - @ TAB CR ya da ' ile baslayan hucreye ' eklenir. */
  function hucre(x) { const s = String(x == null ? "" : x); return /^[=+\-@\t\r']/.test(s) ? "'" + s : s; }
  function tutarMetni(k) { return Math.floor(k / 100) + "." + iki(k % 100); }
  /** Hareket CSV'si (basliklar CSV_BASLIK). Tarih sonra girilis sirasi. Bolunmus hareket parca basina bir satir
   *  (Amount = parca, Split = "i/k"): Amount sutunu toplami == gercek toplamlar (Excel'de dogru).
   *  Kategori/hesap ADI yazilir (yoksa id). opt: rapor filtreleri {bas, son, etiket, hesap, tur} ve
   *  opt.tip "ozet": kategori ozeti (Category, Type, Income, Expense) + Total satiri. -> metin | {hata} */
  function csv(d, opt) {
    const e = dogrula(d); if (e) return e;
    const o = opt || {}; const fe = filtreHatasi(o); if (fe) return { hata: fe };
    const kat = adHaritasi(d.kategoriler), hes = adHaritasi(d.hesaplar);
    if (o.tip === "ozet") {
      if (!tarihMi(o.bas) || !tarihMi(o.son)) return { hata: "aralik" };
      const r = raporIc(d, o); if (r.hata) return r;
      const turu = {}; for (const k of d.kategoriler || []) turu[k.id] = k.tur;
      const satir = [["Category", "Type", "Income", "Expense"]];
      for (const k of Object.keys(r.kategoriye).sort((x, y) => sirala(kat[x] || x, kat[y] || y))) satir.push([kat[k] || k, turu[k] || "", tutarMetni(r.kategoriye[k].gelirKurus), tutarMetni(r.kategoriye[k].giderKurus)]);
      satir.push(["Total", "", tutarMetni(r.gelirKurus), tutarMetni(r.giderKurus)]);
      return C.csvUret(satir.map((s) => s.map(hucre)));
    }
    const sec = d.hareketler.map((h, i) => ({ h: h, i: i })).filter((x) => {
      const h = x.h;
      if (o.bas != null && h.tarih < o.bas) return false;
      if (o.son != null && h.tarih > o.son) return false;
      if (o.tur != null && h.tur !== o.tur) return false;
      if (o.hesap != null && h.hesapId !== o.hesap && h.hedefHesapId !== o.hesap) return false;
      if (o.etiket != null && !(h.etiketler || []).includes(o.etiket)) return false;
      return true;
    }).sort((a, b) => sirala(a.h.tarih, b.h.tarih) || a.i - b.i);
    const satirlar = [CSV_BASLIK];
    for (const x of sec) {
      const h = x.h, ps = h.bolumler || [null];
      ps.forEach((p, j) => {
        const k = p ? p.kategori : h.kategori;
        satirlar.push([h.tarih, h.tur, tutarMetni(p ? p.kurus : h.kurus), k === undefined ? "" : (kat[k] !== undefined ? kat[k] : k),
          hes[h.hesapId], h.hedefHesapId ? hes[h.hedefHesapId] : "", h.not || "", (h.etiketler || []).join(", "),
          p ? (j + 1) + "/" + ps.length : "", h.id, h.tekrarId || "", h.tekrarTarih || "", h.sabit ? "yes" : ""].map(hucre));
      });
    }
    return C.csvUret(satirlar);
  }

  const SUTUN_ADLARI = {
    tarih: ["date", "transaction date", "posted date", "posting date", "booking date"], tur: ["type"],
    tutar: ["amount", "value", "sum"], gider: ["debit", "withdrawal", "withdrawals", "money out"], gelir: ["credit", "deposit", "deposits", "money in"],
    kategori: ["category"], hesap: ["account"], hedefHesap: ["to account"],
    not: ["note", "notes", "description", "memo", "payee", "details"], etiketler: ["tags", "tag"], bolum: ["split"],
    id: ["id"], tekrarId: ["recurring id"], tekrarTarih: ["recurring date"], sabit: ["fixed"],
  };
  /** Banka CSV tutari: "12.50", "-45.00", "-$45.00", "$-45.00", "(12.00)" (muhasebe eksisi), "45.00-" (sonda eksi),
   *  "1,234.56", "1.234,56". Eksi isaret iki kez verilirse ("(-5)") gecersiz. -> isaretli kurus | null */
  function csvTutar(s) {
    let x = String(s == null ? "" : s).trim().replace(/\s/g, ""), eksi = 0;
    if (x[0] === "(" && x[x.length - 1] === ")") { eksi++; x = x.slice(1, -1); }
    if (/[\-−]$/.test(x)) { eksi++; x = x.slice(0, -1); }
    if (/^[\-−]/.test(x)) { eksi++; x = x.slice(1); }
    x = x.replace(PARA_SIMGE, "");
    if (/^[\-−]/.test(x)) { eksi++; x = x.slice(1); }
    if (eksi > 1 || !/^[\d.,]+$/.test(x)) return null;
    const k = B.kurusAyristir(x);
    return k === null ? null : eksi ? -k : k;
  }
  function fnv(s) { let h = 0x811c9dc5; for (let i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 0x01000193) >>> 0; } return h.toString(16).padStart(8, "0"); }
  function tarihCoz(s, bicim) {
    const t = s.trim();
    if (!bicim || bicim === "YMD") {
      const m = /^(\d{4})[-/.](\d{1,2})[-/.](\d{1,2})$/.exec(t);
      if (!m) return null;
      const r = m[1] + "-" + iki(+m[2]) + "-" + iki(+m[3]);
      return tarihMi(r) ? r : null;
    }
    const m = /^(\d{1,2})[-/.](\d{1,2})[-/.](\d{4}|\d{2})$/.exec(t);
    if (!m) return null;
    const y = m[3].length === 2 ? "20" + m[3] : m[3];
    const r = bicim === "MDY" ? y + "-" + iki(+m[1]) + "-" + iki(+m[2]) : y + "-" + iki(+m[2]) + "-" + iki(+m[1]);
    return tarihMi(r) ? r : null;
  }
  /** CSV ice aktarma (kullanicinin kendi dosyasi). esleme: {
   *    durum? (kategoriler/hesaplar buradan), kategoriler?, hesaplar?, varsayilanHesap? (hesap sutunu yok/bilinmiyorsa),
   *    sutunlar?: {tarih:"Posted", tutar:"Amt", ...} (alan -> baslik; yoksa bilinen adlar, buyuk/kucuk harf duyarsiz),
   *    tarihBicimi?: "YMD"(varsayilan)|"MDY"|"DMY", isaretli?: true (eksi tutar = gider; Type sutunu yoksa da boyle),
   *    kesmeKaldir?: true (varsayilan; hucre basindaki tek ' silinir) }
   *  Kategori: once ad (tam, sonra buyuk/kucuk harfsiz), sonra id; bilinmeyen metin id olarak kalir. Hesap: ad/id; yoksa varsayilanHesap; yoksa satir hatasi.
   *  Debit/Credit sutunlari (Amount yoksa) desteklenir. ID yoksa icerikten kararli id ("csv-<hash>[-n]"): ayni dosyayi
   *  tekrar almak hareketlerEkle(..., {cakisma:"atla"}) ile cift kayit yapmaz.
   *  -> {hareketler:[...], hatalar:[{satir (veri satiri sirasi, baslik = 1), yol}], adet} | {hata:"baslik"|"metin"} */
  function csvIceAktar(metin, esleme) {
    if (typeof metin !== "string") return { hata: "metin" };
    const es = esleme || {};
    const kaynak = nesneMi(es.durum) ? es.durum : es;
    const kats = Array.isArray(kaynak.kategoriler) ? kaynak.kategoriler.filter(nesneMi) : [];
    const hess = Array.isArray(kaynak.hesaplar) ? kaynak.hesaplar.filter(nesneMi) : [];
    const kesme = es.kesmeKaldir !== false;
    const satirlar = C.csvAyristir(metin);
    if (!satirlar.length) return { hata: "baslik" };
    const temiz = (s) => { const x = s == null ? "" : String(s); return kesme && x[0] === "'" ? x.slice(1) : x; };
    const baslik = satirlar[0].map((x) => temiz(x).trim().toLowerCase());
    const sutun = {};
    for (const alan of Object.keys(SUTUN_ADLARI)) {
      const ozel = es.sutunlar && typeof es.sutunlar[alan] === "string" ? [es.sutunlar[alan].trim().toLowerCase()] : SUTUN_ADLARI[alan];
      const i = baslik.findIndex((b) => ozel.indexOf(b) >= 0);
      if (i >= 0) sutun[alan] = i;
    }
    if (sutun.tarih === undefined || (sutun.tutar === undefined && sutun.gider === undefined && sutun.gelir === undefined)) return { hata: "baslik" };
    // Ayni adli gelir ve gider kategorisi olabilir: once satirin turundeki kategori aranir, sonra herhangi biri.
    const katBul = (s, tur) => {
      if (s === "") return undefined;
      const bul = (l) => l.find((k) => k.ad === s) || l.find((k) => k.id === s) || l.find((k) => typeof k.ad === "string" && k.ad.toLowerCase() === s.toLowerCase());
      const a = bul(kats.filter((k) => k.tur === tur)) || bul(kats);
      return a ? a.id : s;
    };
    const hesBul = (s) => {
      if (s === "") return null;
      const a = hess.find((k) => k.ad === s) || hess.find((k) => k.id === s) || hess.find((k) => typeof k.ad === "string" && k.ad.toLowerCase() === s.toLowerCase());
      return a ? a.id : null;
    };
    const hesapIds = hess.length ? new Set(hess.map((h) => h.id)) : null;
    const hareketler = [], hatalar = [], gorulen = {}, idler = new Set();
    let grup = null;
    const grupKapat = () => {
      if (!grup) return;
      const g = grup; grup = null;
      if (g.parcalar.length !== g.k) { hatalar.push({ satir: g.satir, yol: "bolum" }); return; }
      g.h.kurus = g.parcalar.reduce((t, p) => t + p.kurus, 0);
      g.h.bolumler = g.parcalar;
      if (!g.h.id) { // ID'siz fis: kimlik TUM parcalardan (ayni gun/hesap/notta iki farkli fis cakismaz; ayni fis iki kez -> -2)
        const anahtar = fnv([g.h.tarih, g.h.tur, g.h.hesapId, g.h.not || "", "split"].concat(g.parcalar.map((p) => p.kategori + ":" + p.kurus)).join("\u0001"));
        gorulen[anahtar] = (gorulen[anahtar] || 0) + 1;
        g.h.id = "csv-" + anahtar + (gorulen[anahtar] > 1 ? "-" + gorulen[anahtar] : "");
      }
      bitir(g.h, g.satir);
    };
    const bitir = (h, satirNo) => {
      const he = hareketHatasi(h, hesapIds, false);
      if (he !== null) { hatalar.push({ satir: satirNo, yol: he || "satir" }); return; }
      if (idler.has(h.id)) { hatalar.push({ satir: satirNo, yol: "id" }); return; }
      idler.add(h.id); hareketler.push(h);
    };
    for (let r = 1; r < satirlar.length; r++) {
      const ham = satirlar[r], al = (alan) => (sutun[alan] === undefined ? "" : temiz(ham[sutun[alan]]));
      const satirNo = r + 1;
      if (ham.every((x) => String(x).trim() === "")) continue;
      const tarih = tarihCoz(al("tarih"), es.tarihBicimi);
      if (!tarih) { grupKapat(); hatalar.push({ satir: satirNo, yol: "tarih" }); continue; }
      // Tutar ve tur: Type sutunu bossa/yoksa isaret karar verir (eksi = gider); Type varken eksi tutar yalniz isaretli modda kabul.
      let tur = al("tur").trim().toLowerCase(), kurus = null;
      if (sutun.tutar !== undefined) {
        kurus = csvTutar(al("tutar"));
        if (kurus !== null && kurus !== 0) {
          if (tur === "") { tur = kurus < 0 ? "expense" : "income"; kurus = Math.abs(kurus); }
          else if (kurus < 0) kurus = es.isaretli ? -kurus : null;
        }
      } else {
        const gd = al("gider").trim() ? csvTutar(al("gider")) : 0, gl = al("gelir").trim() ? csvTutar(al("gelir")) : 0;
        if (gd !== null && gl !== null && (gd === 0) !== (gl === 0)) { if (tur === "") tur = gl !== 0 ? "income" : "expense"; kurus = Math.abs(gl || gd); }
      }
      if (kurus === null || kurus === 0) { grupKapat(); hatalar.push({ satir: satirNo, yol: "tutar" }); continue; }
      if (TURLER.indexOf(tur) < 0) { grupKapat(); hatalar.push({ satir: satirNo, yol: "tur" }); continue; }
      let hesapId = hesBul(al("hesap"));
      if (hesapId === null) {
        if (al("hesap") !== "" && !hess.length) hesapId = al("hesap");
        else if (typeof es.varsayilanHesap === "string") hesapId = es.varsayilanHesap;
      }
      if (hesapId === null) { grupKapat(); hatalar.push({ satir: satirNo, yol: "hesapId" }); continue; }
      const h = { id: "", tur: tur, tarih: tarih, kurus: kurus, hesapId: hesapId };
      if (tur === "transfer") {
        const hh = hesBul(al("hedefHesap"));
        h.hedefHesapId = hh !== null ? hh : (al("hedefHesap") !== "" && !hess.length ? al("hedefHesap") : "");
      }
      const kat = tur === "transfer" ? undefined : katBul(al("kategori"), tur);
      const not = al("not"); if (not.trim() !== "") h.not = not;
      const ets = al("etiketler").split(",").map((x) => x.trim().toLowerCase().replace(/^#/, "")).filter(Boolean);
      if (ets.length) h.etiketler = ets.filter((x, i) => ets.indexOf(x) === i);
      const tid = al("tekrarId"), ttar = al("tekrarTarih");
      if (tid !== "" || ttar !== "") { h.tekrarId = tid; h.tekrarTarih = ttar; }
      if (/^(yes|true|1)$/i.test(al("sabit").trim())) h.sabit = true;
      const idHam = al("id").trim();
      const bolum = al("bolum").trim();
      const bm = /^(\d+)\/(\d+)$/.exec(bolum);
      if (bolum !== "" && !bm) { grupKapat(); hatalar.push({ satir: satirNo, yol: "bolum" }); continue; }
      if (bm) {
        const i = +bm[1], k = +bm[2];
        if (i === 1) {
          grupKapat();
          if (k < 2 || k > MAKS.bolum || kurus < 0) { hatalar.push({ satir: satirNo, yol: "bolum" }); continue; }
          h.id = idHam; // bos ise grupKapat parcalardan kararli kimlik uretir
          grup = { h: h, k: k, satir: satirNo, imza: [tarih, tur, hesapId, idHam].join("|"), parcalar: [{ kategori: kat === undefined ? UNCAT : kat, kurus: kurus }] };
        } else {
          const imza = [tarih, tur, hesapId, idHam].join("|");
          if (!grup || grup.parcalar.length + 1 !== i || grup.k !== k || grup.imza !== imza) { grupKapat(); hatalar.push({ satir: satirNo, yol: "bolum" }); continue; }
          grup.parcalar.push({ kategori: kat === undefined ? UNCAT : kat, kurus: kurus });
          if (i === k) grupKapat();
        }
        continue;
      }
      grupKapat();
      if (kat !== undefined) h.kategori = kat;
      if (idHam) h.id = idHam;
      else {
        const anahtar = fnv([tarih, tur, kurus, hesapId, h.hedefHesapId || "", kat || "", not].join("\u0001"));
        gorulen[anahtar] = (gorulen[anahtar] || 0) + 1;
        h.id = "csv-" + anahtar + (gorulen[anahtar] > 1 ? "-" + gorulen[anahtar] : "");
      }
      bitir(h, satirNo);
    }
    grupKapat();
    return { hareketler: hareketler, hatalar: hatalar, adet: hareketler.length };
  }

  // ---------------------------------------------------------------- baslangic / ornek veri
  const VARSAYILAN_KATEGORILER = [
    { id: "salary", ad: "Salary", tur: "income" }, { id: "side", ad: "Side income", tur: "income" }, { id: "other-in", ad: "Other income", tur: "income" },
    { id: "groceries", ad: "Groceries", tur: "expense" }, { id: "rent", ad: "Rent", tur: "expense" }, { id: "bills", ad: "Bills", tur: "expense" },
    { id: "dining", ad: "Dining out", tur: "expense" }, { id: "transport", ad: "Transport", tur: "expense" }, { id: "shopping", ad: "Shopping", tur: "expense" },
    { id: "health", ad: "Health", tur: "expense" }, { id: "fun", ad: "Fun", tur: "expense" }, { id: "home", ad: "Home", tur: "expense" },
  ];
  /** Bos baslangic durumu: 2 hesap (Cash, Bank; acilis 0), varsayilan kategoriler, bos listeler. */
  function bos() {
    return { hesaplar: [{ id: "cash", ad: "Cash", tur: "cash", acilisKurus: 0 }, { id: "bank", ad: "Bank", tur: "bank", acilisKurus: 0 }],
      kategoriler: VARSAYILAN_KATEGORILER.map((k) => Object.assign({}, k)), hareketler: [], tekrarlar: [], limitler: [], hedefler: [], geriBakislar: [] };
  }
  /** Ornek veri (kararli): 3 hesap + 1 kart, bugunun ayi dahil son 3 ay ~120 hareket, maas + kira tekrarlari,
   *  1 transfer (kart odemesi), 1 bolunmus hareket, 2 etiket (business, reimbursable), 6 limit, 2 hedef. Gecersiz bugun -> null. */
  function ornekVeri(bugun) {
    if (!tarihMi(bugun)) return null;
    let a = 20261015 >>> 0;
    const R = () => { a = (a + 0x6D2B79F5) >>> 0; let t = a; t = Math.imul(t ^ (t >>> 15), t | 1); t ^= t + Math.imul(t ^ (t >>> 7), t | 61); return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };
    const tam = (x, y) => x + Math.floor(R() * (y - x + 1));
    const ilkAy = B.ayEkle(bugun.slice(0, 8) + "01", -2);
    const d = bos();
    d.hesaplar = [{ id: "bank", ad: "Checking", tur: "bank", acilisKurus: 245000 }, { id: "cash", ad: "Cash", tur: "cash", acilisKurus: 60000 },
      { id: "savings", ad: "Savings", tur: "savings", acilisKurus: 420000 }, { id: "card", ad: "Credit card", tur: "card", acilisKurus: -38000 }];
    d.tekrarlar = [
      { id: "salary", sablon: { tur: "income", kurus: 310000, kategori: "salary", hesapId: "bank", not: "Paycheck" }, sikilik: "monthly", ilk: ilkAy },
      { id: "rent", sablon: { tur: "expense", kurus: 125000, kategori: "rent", hesapId: "bank", not: "Rent" }, sikilik: "monthly", ilk: B.gunEkle(ilkAy, 2) },
    ];

    const s = {};
    for (const n of h || []) if (Number.isInteger(n) && n >= 1 && n <= HAFTA) s[n] = true;
    return Object.keys(s).map(Number).sort((a, b) => a - b);
  }

  /** Bir haftayi isaretle / isareti kaldir: yeni, sirali dizi doner. */
  function haftaDegistir(haftalar, n) {
    const t = haftaTemiz(haftalar);
    if (!Number.isInteger(n) || n < 1 || n > HAFTA) return t;
    const i = t.indexOf(n);
    if (i >= 0) t.splice(i, 1); else { t.push(n); t.sort((a, b) => a - b); }
    return t;
  }

  /** m: {tip, birimKurus, haftalar:[n]} -> toplam / biriken / kalan / ilerleme. */
  function meydanOzeti(m) {
    const haftalar = haftaTemiz(m.haftalar);
    let toplam = 0, biriken = 0;
    for (let n = 1; n <= HAFTA; n++) {
      const t = haftaTutari(m.tip, m.birimKurus, n);
      toplam += t;
      if (haftalar.indexOf(n) >= 0) biriken += t;
    }
    let sonraki = null;
    for (let n = 1; n <= HAFTA; n++) if (haftalar.indexOf(n) < 0) { sonraki = n; break; }
    return {
      toplamKurus: toplam, birikenKurus: biriken, kalanKurus: toplam - biriken,
      tamamHafta: haftalar.length, kalanHafta: HAFTA - haftalar.length,
      yuzde: Math.floor(haftalar.length * 100 / HAFTA),
      sonrakiHafta: sonraki, sonrakiKurus: sonraki ? haftaTutari(m.tip, m.birimKurus, sonraki) : 0,
      bitti: haftalar.length === HAFTA,
    };
  }

  // ---------------------------------------------------------------- hedef plani

  function bolYukari(a, b) { return Math.floor(a / b) + (a % b ? 1 : 0); }
  const COK_UZAK = 2000; // donem: bunun ustunde tarih verilmez

  /** Hedef {hedefKurus, birikmisKurus, donemBasiKurus}: kalan, yuzde, kac maasta biter,
   *  ekKurus kadar fazla koyarsa kac maas erken biter. donem+bugun verilirse bitis tarihi de hesaplanir. */
  function hedefPlani(hedef, ekKurus, donem, bugun) {
    const hedefK = Math.max(0, hedef.hedefKurus || 0), birik = Math.max(0, hedef.birikmisKurus || 0);
    const pay = Math.max(0, hedef.donemBasiKurus || 0), ek = Math.max(0, ekKurus || 0);
    const kalan = Math.max(0, hedefK - birik);
    const yuzde = hedefK > 0 ? Math.min(100, Number(BigInt(birik) * 100n / BigInt(hedefK))) : 0;
    const say = (p) => (kalan === 0 ? 0 : p > 0 ? bolYukari(kalan, p) : null);
    const n0 = say(pay), n1 = say(pay + ek);
    const tarih = (n) => {
      if (n === null || !bugun || !donemGecerli(donem) || n > COK_UZAK) return null;
      if (n === 0) return bugun;
      return B.donemler(donem, bugun, n)[n - 1].bitis;
    };
    return {
      hedefKurus: hedefK, birikmisKurus: birik, kalanKurus: kalan, yuzde: yuzde,
      tamam: hedefK > 0 && kalan === 0,
      payKurus: pay, donemSayisi: n0, bitisTarihi: tarih(n0),
      ekPayKurus: pay + ek, ekDonemSayisi: n1, ekBitisTarihi: tarih(n1),
      erkenDonem: (n0 !== null && n1 !== null) ? n0 - n1 : null,
    };
  }

  // ---------------------------------------------------------------- kilometre taslari
  // Yalniz kazanilir, kaybolmaz: kazanilan = onceden kayitli ∪ simdi saglananlar.

  const KILOMETRE = ["ilkGider", "yediGun", "harcamasizGun", "faturalarTamam", "ilkHedef", "hedefTamam", "yarimMeydan"];

  function kosullar(d, bugun) {
    const har = d.hareketler || [];
    const giderGunleri = {}, tumGunler = {};
    let ilk = null;
    for (const h of har) {
      tumGunler[h.tarih] = true;
      if (h.kurus < 0) giderGunleri[h.tarih] = true;
      if (ilk === null || h.tarih < ilk) ilk = h.tarih;
    }
    let harcamasiz = false;
    if (ilk !== null) {
      for (let t = ilk; t < bugun && !harcamasiz; t = B.gunEkle(t, 1)) if (!giderGunleri[t]) harcamasiz = true;
    }
    let faturalarTamam = false;
    if (donemGecerli(d.donem)) {
      const ar = B.donemAraligi(d.donem, bugun);
      let say = 0, odenen = 0;
      for (const f of d.faturalar || []) for (const v of faturaVadeleriGuvenli(f, ar)) { say++; if ((f.odendi || []).indexOf(v) >= 0) odenen++; }
      faturalarTamam = say > 0 && say === odenen;
    }
    const hd = d.hedefler || [];
    return {
      ilkGider: har.some((h) => h.kurus < 0),
      yediGun: Object.keys(tumGunler).length >= 7,
      harcamasizGun: harcamasiz,
      faturalarTamam: faturalarTamam,
      ilkHedef: hd.length > 0,
      hedefTamam: hd.some((h) => h.hedefKurus > 0 && h.birikmisKurus >= h.hedefKurus),
      yarimMeydan: (d.meydanOkumalar || []).some((m) => haftaTemiz(m.haftalar).length >= HAFTA / 2),
    };
  }

  /** Donus: {liste:[{id, kazanildi, yeni, sonraki}], kazanilan:[id], yeniler:[id]}.
   *  Kayitli (durum.kilometre) olanlar HER ZAMAN kazanilmis kalir. */
  function kilometreTaslari(d, bugun) {
    const kayitli = d.kilometre || [];
    const simdi = kosullar(d, bugun);
    const liste = [], yeniler = [], kazanilan = [];
    let sonrakiVerildi = false;
    for (const id of KILOMETRE) {
      const kazanildi = kayitli.indexOf(id) >= 0 || simdi[id];
      const yeni = kazanildi && kayitli.indexOf(id) < 0;
      let sonraki = false;
      if (!kazanildi && !sonrakiVerildi) { sonraki = true; sonrakiVerildi = true; }
      if (yeni) yeniler.push(id);
      if (kazanildi) kazanilan.push(id);
      liste.push({ id: id, kazanildi: kazanildi, yeni: yeni, sonraki: sonraki });
    }
    // bilinmeyen eski kayitlar da korunur
    for (const id of kayitli) if (KILOMETRE.indexOf(id) < 0) kazanilan.push(id);
    return { liste: liste, kazanilan: kazanilan, yeniler: yeniler };
  }

  // ---------------------------------------------------------------- borc

  /** Gercek kartopu (kapanan borcun asgarisi havuzda kalir) icin Borc.plan; eski butce.borcPlani devri yapmiyordu.
   *  Bozuk girdide (hata) kapanmayan plan gibi doner: sessizce yanlis sayi uretmez. */
  function bp(borclar, ek, yontem) {
    const p = Borc.plan(borclar, { strateji: yontem === "avalanche" ? "avalanche" : "snowball", ekAylikKurus: ek, enFazlaAy: 600 });
    if (p.hata) return { kapandi: false, ayAdedi: 0, toplamFaizKurus: 0, toplamOdemeKurus: 0, kalanKurus: borclar.reduce((t, b) => t + (b.bakiyeKurus || 0), 0), anaparaKurus: borclar.reduce((t, b) => t + (b.bakiyeKurus || 0), 0), aylar: [], hata: p.hata };
    return p;
  }

  /** Ek odemeyle kapanmasi icin gereken en kucuk aylik ek tutar (kurus); olmazsa null. */
  function enAzEk(borclar, yontem) {
    const anapara = borclar.reduce((t, b) => t + (b.bakiyeKurus > 0 ? b.bakiyeKurus : 0), 0);
    if (anapara === 0) return 0;
    const kapanir = (ek) => bp(borclar, ek, yontem).kapandi;
    let lo = 0, hi = anapara * 2;
    if (!B.kurusMu(hi) || !kapanir(hi)) return null;
    while (lo < hi) {
      const mid = Math.floor((lo + hi) / 2);
      if (kapanir(mid)) hi = mid; else lo = mid + 1;
    }
    return lo;
  }

  function ozet(p, bugun) {
    return {
      kapandi: p.kapandi, ayAdedi: p.ayAdedi, faizKurus: p.toplamFaizKurus, odemeKurus: p.toplamOdemeKurus,
      kalanKurus: p.kalanKurus, borcsuzTarih: p.kapandi ? B.ayEkle(bugun, p.ayAdedi) : null,
    };
  }

  /** Ek odeme yokken ve ekKurus ile borc planlari + fark. Sessizce yanlis sayi uretmez:
   *  kapanmayan plan icin tarih/fark yok, gerekliEkKurus var. */
  function borcKarsilastir(borclar, ekKurus, yontem, bugun) {
    const ek = Math.max(0, ekKurus || 0);
    if (!borclar.some((b) => b.bakiyeKurus > 0)) return { bos: true };
    const pT = bp(borclar, 0, yontem);
    const pE = ek > 0 ? bp(borclar, ek, yontem) : pT;
    const taban = ozet(pT, bugun), ekli = ozet(pE, bugun);
    const ikisiKapandi = taban.kapandi && ekli.kapandi;
    return {
      bos: false, yontem: yontem, ekKurus: ek,
      taban: taban, ekli: ekli, anaparaKurus: pT.anaparaKurus,
      kapaniyor: ekli.kapandi,
      ekKapatir: !taban.kapandi && ekli.kapandi,
      erkenAy: ikisiKapandi ? taban.ayAdedi - ekli.ayAdedi : null,
      azFaizKurus: ikisiKapandi ? taban.faizKurus - ekli.faizKurus : null,
      gerekliEkKurus: ekli.kapandi ? 0 : enAzEk(borclar, yontem),
      ekliPlan: pE,
    };
  }

  /** Ilk ayda fazla odemenin gidecegi borcun id'si (motorla ayni sira: faiz eklendikten sonra). */
  function hedefBorc(borclar, yontem) {
    const acik = borclar.filter((b) => b.bakiyeKurus > 0).map((b) => ({
      id: b.id, kurus: b.bakiyeKurus + Math.round(b.bakiyeKurus * (b.yillikOran || 0) / 12), oran: b.yillikOran || 0,
    }));
    if (!acik.length) return null;
    acik.sort(yontem === "avalanche"
      ? (x, y) => y.oran - x.oran || x.kurus - y.kurus
      : (x, y) => x.kurus - y.kurus || y.oran - x.oran);
    return acik[0].id;
  }

  // ---------------------------------------------------------------- "bu harcama sigar mi" / bakiye guveni

  /** Bu harcama guvenli tutara sigar mi, harcamadan sonra ne kalir. */
  function sigarMi(durum, bugun, kurus) {
    if (!B.kurusMu(kurus) || kurus <= 0) return { gecersiz: true };
    const g = B.guvenliHarcanabilir(durum, bugun);
    const kalan = g.guvenliKurus - kurus;
    if (!B.kurusMu(kalan)) return { gecersiz: true };
    return {
      gecersiz: false, sigar: kalan >= 0, guvenliKurus: g.guvenliKurus, kalanKurus: kalan,
      kalanGun: g.kalanGun, gunlukKurus: B.gunlukPay(kalan, g.kalanGun),
    };
  }

  /** "Check my balance" icin guven ozeti: bakiye ne kadar guncel, hemen ne yapmali. */
  function guvenOzeti(durum, bugun) {
    const s = B.guvenSeviyesi(durum, bugun);
    const g = B.guvenliHarcanabilir(durum, bugun);
    return {
      seviye: s.seviye, gun: s.gun, bakiyeTarihi: durum.bakiyeTarihi || null,
      guvenliKurus: g.guvenliKurus, bakiyeKurus: g.bakiyeKurus, kalanGun: g.kalanGun,
      sonEtkinlik: B.sonEtkinlik(durum), kontrolOnerilir: s.seviye !== "fresh",
    };
  }

  const API = {
    ayAraligi: ayAraligi, maasGunleri: maasGunleri, maasKaynaklari: maasKaynaklari,
    ayIzgarasi: ayIzgarasi, icsOlaylari: icsOlaylari,
    HAFTA: HAFTA, MEYDAN_TIPLERI: MEYDAN_TIPLERI, BIRIM_SINIR: BIRIM_SINIR,
    haftaTutari: haftaTutari, haftaDegistir: haftaDegistir, haftaTemiz: haftaTemiz, meydanOzeti: meydanOzeti,
    hedefPlani: hedefPlani, COK_UZAK: COK_UZAK,
    KILOMETRE: KILOMETRE, kilometreTaslari: kilometreTaslari,
    borcKarsilastir: borcKarsilastir, enAzEk: enAzEk, hedefBorc: hedefBorc,
    sigarMi: sigarMi, guvenOzeti: guvenOzeti,
  };
  if (typeof module !== "undefined" && module.exports) module.exports = API;
  else kok.Plan = API;
})(typeof globalThis !== "undefined" ? globalThis : this);

</script>

/* ornek-onay.js */
/* Urun ortak katmani (yalniz --urun derlemeleri, borc HARIC: borc ve ana urun ciktisi bayt bayt ayni kalsin diye derle.js eklemez).
 * Settings > "Fill with sample data": kullanicinin kendi verisi varken ONAY sorar (onceden sessizce ezip "Done." + Undo diyordu).
 *  - Urun kendi yolunu verirse (App.urunOrnekYukle; dugun: anlik goruntulu O.ornekYukle) o kullanilir.
 *  - Yoksa: veri var mi? App.urunVeriVar() varsa o, yoksa durum varsayilanla karsilastirilir (ayarlar/kisisel/kuruldu disinda dolu dizi).
 * ayarlar.js'e dokunulmaz (ana urunde de yuklenir): dugme Settings cizilince isaretlenir (data-ornek-doldur), tiklama yakalama
 * evresinde alinir ve ayarlar.js'in kendi dinleyicisi calismaz. Metinler: v2/urun-ortak/ceviri.json (5 dil). */
(function () {
  "use strict";
  var el = App.el;
  function t(k, d) { return App.t(k, d); }
  var DISI = { ayarlar: 1, kisisel: 1, kuruldu: 1 };

  /** x'te, varsayilan v'den farkli dolu bir dizi var mi (ic ice nesneler dahil)? */
  function doluFark(x, v) {
    if (Array.isArray(x)) return x.length > 0 && JSON.stringify(x) !== JSON.stringify(v || []);
    if (x && typeof x === "object") return Object.keys(x).some(function (k) { return doluFark(x[k], v && typeof v === "object" ? v[k] : undefined); });
    return false;
  }
  App.urunVeriVarMi = function () {
    if (App.urunVeriVar) return !!App.urunVeriVar();
    var d = App.durum, v = App.varsayilan();
    if (App.urunVarsayilan) Object.assign(v, App.urunVarsayilan()); // App.varsayilan urun alanlarini icermez (gezi: kisiler [Me])
    return Object.keys(d).some(function (k) { return !DISI[k] && doluFark(d[k], v[k]); });
  };
  App.ornekDoldur = function () {
    if (App.urunOrnekYukle) { App.urunOrnekYukle(); return; }
    function yukle() { App.degistir(App.ornekVeri(), t("ayar.hazir", "Done.")); }
    if (!App.urunVeriVarMi()) { yukle(); return; }
    App.dialog({ baslik: t("ayar.ornek.onay.baslik", "Replace with sample data?"),
      govde: el("p", { metin: t("ayar.ornek.onay", "This replaces what you have. Undo is available right after.") }),
      tamam: t("ayar.ornek.onay.tamam", "Use sample data"), tamamFn: function () { yukle(); } });
  };

  // Settings dugmesini isaretle (metniyle bulunur: ayarlar.js ayni App.t anahtariyla yazar)
  var ekran = App.ekranlar.filter(function (e) { return e.id === "yours"; })[0];
  if (ekran) {
    var cizAsil = ekran.render;
    ekran.render = function (kok) {
      var r = cizAsil.apply(this, arguments), ad = t("ayar.ornek", "Fill with sample data");
      Array.prototype.forEach.call(kok.querySelectorAll("button"), function (b) { if (b.textContent === ad) b.setAttribute("data-ornek-doldur", "1"); });
      return r;
    };
  }
  document.addEventListener("click", function (e) {
    var b = e.target && e.target.closest && e.target.closest("[data-ornek-doldur]");
    if (!b) return;
    e.stopImmediatePropagation(); e.preventDefault();
    App.ornekDoldur();
  }, true);
})();

/* demo.js */
/* DEMO katmani (Expense & Income Tracker). Yalniz `node uygulama/derle.js --urun=gider --demo` ile girer; tam surumde YOKTUR.
 * Ne yapar: (1) ust cubuk + sinir (en fazla 40 hareket, 4 hesap), (2) ilk acilista "ornek veriyle dene" kapisi
 * (ornek = en fazla 30 hareket + 3 hesap: kullanici en az 10 hareket + 1 hesap daha ekleyebilir),
 * (3) sinira gelince duvar (degisim HIC uygulanmadan reddedilir: sahte "Added" bildirimi yok), (4) yedek / Transfer code ile
 * iceri alinan veri de siniri asamaz (App.urunDogrula reddeder), (5) kendiliginden tekrar ekleme siniri asacaksa sessizce atlanir
 * (ay donumunde her acilista duvar cikmaz; elle "Fill missing" ise duvari gosterir).
 * Ag istegi yok. Demo metinleri Ingilizce. */
(function () {
  "use strict";
  var D = window.DEMO; if (!D || !window.App) return;
  var el = App.el, B = App.B, MAKS_H = 40, MAKS_HES = 4, ORNEK_H = 30, ORNEK_HES = 3, engellendi = null;

  function sayilar(gd) { return { h: ((gd && gd.hareketler) || []).length, a: ((gd && gd.hesaplar) || []).length }; }
  function satinAl() {
    if (D.url) { window.open(D.url, "_blank", "noopener"); return; }
    App.dialog({ baslik: "Get the full tracker", govde: el("p", { metin: "The full tracker is a one-time purchase on Etsy: no subscription, no account, your data stays on your device. It has no limit on entries or accounts." }), iptal: "Close" });
  }
  function yedekKaydet() { App.indir("gider-backup-" + App.bugun() + ".json", B.disaAktar(App.durum), "application/json"); }
  function duvar(metin) {
    var govde = el("div", {}, el("p", { metin: metin }), el("p", { class: "alt", style: "margin-top:8px", metin: "Your setup is not lost: save it as a backup file now, and restore it in the full tracker to carry on exactly where you are." }));
    govde.appendChild(el("div", { class: "chips", style: "margin-top:12px" }, el("button", { type: "button", class: "btn", metin: "Save my setup", onclick: yedekKaydet })));
    App.dialog({ baslik: "That is the demo limit", govde: govde, tamam: "Get the full tracker", tamamFn: function () { satinAl(); return false; }, iptal: "Not now" });
  }

  // sinir: degisim once kopyada denenir; asarsa HIC uygulanmaz (durum, Undo adimi ve "Added ..." bildirimi degismez), duvar acilir
  var degistirAsil = App.degistir;
  function asimMetni(fn) {
    var k; try { k = JSON.parse(JSON.stringify(App.durum)); fn(k); } catch (e) { return null; }
    var n = sayilar(k.gd);
    return n.h > MAKS_H ? "The demo holds up to " + MAKS_H + " entries." : n.a > MAKS_HES ? "The demo holds up to " + MAKS_HES + " accounts." : null;
  }
  App.degistir = function (fn, mesaj) {
    var m = asimMetni(fn);
    if (m) { setTimeout(function () { duvar(m); }, 50); return undefined; }
    return degistirAsil.call(App, fn, mesaj);
  };
  // kendiliginden tekrar ekleme demo sinirini asacaksa eklemez ve bildirim vermez (tam surumde davranis ayni kalir)
  var O = App.giderOrtak;
  if (O && O.tekrarUygula && O.bekleyenTekrar) {
    var tekrarAsil = O.tekrarUygula;
    O.tekrarUygula = function (oto) {
      if (oto && sayilar(App.durum.gd).h + O.bekleyenTekrar().length > MAKS_H) return false;
      return tekrarAsil.apply(O, arguments);
    };
  }
  // yedek geri yukleme / Transfer code: sinirin ustundeki veri reddedilir
  var dogrulaAsil = App.urunDogrula;
  App.urunDogrula = function (d) {
    var h = dogrulaAsil(d); if (h) return h;
    var n = sayilar(d.gd);
    if (n.h > MAKS_H || n.a > MAKS_HES) { App.demoRed = "That file is over the demo limit (" + MAKS_H + " entries, " + MAKS_HES + " accounts), so nothing was changed. The full tracker has no limit."; return "gd.demoSiniri"; }
    return null;
  };

  // ornek veri: en yeni 30 hareket + 3 hesap (hareketi olan hesaplar kalir); sinirin altinda kalir, kullanici 10+ hareket daha ekleyebilir
  var ornekAsil = App.ornekVeri;
  App.ornekVeri = function () {
    var f = ornekAsil();
    return function (d) {
      f(d);
      var g = d.gd, l = g.hareketler.slice().sort(function (x, y) { return x.tarih < y.tarih ? 1 : x.tarih > y.tarih ? -1 : 0; }).slice(0, ORNEK_H);
      g.hareketler = l.sort(function (x, y) { return x.tarih < y.tarih ? -1 : x.tarih > y.tarih ? 1 : 0; });
      var kullanilan = {};
      g.hareketler.forEach(function (h) { kullanilan[h.hesapId] = 1; if (h.hedefHesapId) kullanilan[h.hedefHesapId] = 1; });
      var kal = g.hesaplar.filter(function (x) { return kullanilan[x.id]; }), yedek = g.hesaplar.filter(function (x) { return !kullanilan[x.id]; });
      g.hesaplar = kal.concat(yedek).slice(0, ORNEK_HES);
      (g.tekrarlar || []).slice().forEach(function (tk) { // kirpilan eski girisler "eksik tekrar" olarak geri onerilmesin
        var ts = g.hareketler.filter(function (h) { return h.tekrarId === tk.id; }).map(function (h) { return h.tekrarTarih; }).sort();
        if (!ts.length) g.tekrarlar.splice(g.tekrarlar.indexOf(tk), 1); // kirpmadan sonra hic girisi kalmadiysa sablon da gider
        else if (ts[0] > tk.ilk) tk.ilk = ts[0];
      });
    };
  };

  // ilk acilis kapisi
  var ana = App.ekranlar.filter(function (e) { return e.id === "add"; })[0], asil = ana.render, secildi = false;
  ana.render = function (kok) {
    var gd = App.giderOrtak.gd();
    if (!secildi && !gd.hareketler.length) {
      kok.appendChild(App.baslik(App.t("nav.add", "Add"), "Try it with an example", "Two ways to start. Nothing you type here leaves your device."));
      kok.appendChild(App.kart(el("h3", {}, "Show me an example"), el("p", { class: "alt", metin: "A few weeks of sample entries on three accounts, so you can see every screen filled in. You can add your own on top." }),
        el("button", { type: "button", class: "btn ana-d", style: "margin-top:10px", metin: "Show me an example", onclick: function () { secildi = true; App.degistir(App.ornekVeri(), "Example loaded. Your own work is kept when you reset it."); } })));
      kok.appendChild(App.kart(el("h3", {}, "Start with my own entries"), el("p", { class: "alt", metin: "The demo holds " + MAKS_H + " entries and " + MAKS_HES + " accounts." }),
        el("button", { type: "button", class: "btn", style: "margin-top:10px", metin: "Start with my own entries", onclick: function () { secildi = true; App.yenile(); } })));
      return;
    }
    return asil.call(ana, kok);
  };

  var stil = document.createElement("style");
  stil.textContent = ".demobar{position:sticky;top:0;z-index:40;display:flex;flex-wrap:wrap;gap:6px 14px;align-items:center;justify-content:center;padding:8px 14px;background:var(--hero-a);color:var(--hero-yazi);font-size:.84rem;line-height:1.3}" +
    ".demobar b{font-variant-numeric:tabular-nums}.demobar button{font:inherit;font-weight:700;cursor:pointer;border-radius:999px;padding:4px 14px;border:1.5px solid currentColor;background:transparent;color:inherit}" +
    ".demobar .al{background:var(--hero-yazi);color:var(--hero-a);border-color:var(--hero-yazi)}.demobar .lnk{border:0;text-decoration:underline;font-weight:500;padding:4px 2px}" +
    ".yan{top:var(--demo-h,0px)!important;height:calc(100vh - var(--demo-h,0px))!important}@media print{.demobar{display:none!important}}";
  document.head.appendChild(stil);
  var bar = el("div", { class: "demobar", id: "demobar", role: "region", "aria-label": "Free demo" });
  document.body.insertBefore(bar, document.body.firstChild);
  function barCiz() {
    var n = sayilar(App.durum.gd);
    bar.textContent = "";
    bar.appendChild(el("span", { metin: "Free demo · saved in this browser only" }));
    bar.appendChild(el("span", {}, el("b", { metin: String(n.h) }), " of " + MAKS_H + " entries · ", el("b", { metin: String(n.a) }), " of " + MAKS_HES + " accounts"));
    bar.appendChild(el("button", { type: "button", class: "al", metin: "Get the full tracker", onclick: satinAl }));
    bar.appendChild(el("button", { type: "button", class: "lnk", metin: "Save my setup", onclick: yedekKaydet }));
  }
  var yenileAsil = App.yenile;
  App.yenile = function () { yenileAsil.apply(App, arguments); barCiz(); document.documentElement.style.setProperty("--demo-h", bar.offsetHeight + "px"); };
  App.demoDuzelt = function (d) { d.ayarlar = d.ayarlar || {}; d.ayarlar.dil = "en"; return d; };
})();

</script>
<script>
App.baslat();
</script>
</body>
</html>
