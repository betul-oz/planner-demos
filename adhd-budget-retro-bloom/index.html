/* ---------- TOKENS: renkler temalar/*.css icinde (her tema = bir token blogu; acik + koyu) ---------- */
:root { --serif:"Fraunces", ui-serif, Georgia, serif; --r:20px; }

*{box-sizing:border-box} html,body{margin:0;background:var(--bg);color:var(--yazi)}
body{font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
button{font:inherit;color:inherit;cursor:pointer}
h1,h2,h3,p{margin:0}
.serif{font-family:var(--serif);font-weight:600}
[hidden]{display:none!important}

/* ---------- iskelet ---------- */
.uyg{display:grid;grid-template-columns:248px 1fr;min-height:100vh}
.yan{background:var(--panel);border-right:1px solid var(--cizgi);padding:20px 14px;position:sticky;top:0;height:100vh;overflow:auto}
.marka{display:flex;gap:10px;align-items:center;padding:4px 8px 16px}
.marka i{width:34px;height:34px;border-radius:11px;background:linear-gradient(155deg,var(--hero-a),var(--hero-b));display:block}
.marka b{font-family:var(--serif);font-size:1.05rem;line-height:1.1} .marka small{display:block;color:var(--soluk);font-size:.72rem}
.basit{display:flex;justify-content:space-between;align-items:center;background:var(--kart);border:1px solid var(--cizgi);border-radius:14px;padding:8px 12px;margin:0 0 12px;font-size:.85rem}
.sw{width:42px;height:24px;border-radius:99px;background:var(--cizgi);border:0;position:relative;padding:0}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:#fff;transition:.2s}
.sw[aria-pressed=true]{background:var(--vurgu)} .sw[aria-pressed=true]::after{left:21px}
.grup{font-size:.68rem;letter-spacing:.12em;text-transform:uppercase;color:var(--soluk);font-weight:700;margin:16px 10px 6px}
.nav{display:flex;align-items:center;gap:10px;width:100%;min-height:44px;padding:8px 12px;border:0;background:none;border-radius:12px;text-align:left;color:var(--yazi)}
.nav:hover{background:var(--vurgu-acik)} .nav[aria-current=page]{background:var(--vurgu);color:var(--vurgu-yazi);font-weight:600}
.nav svg{width:20px;height:20px;flex:none;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.basit-acik .ileri{display:none}
.ana{padding:28px clamp(16px,4vw,44px) 110px;max-width:1180px;width:100%}
.ust{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;margin-bottom:22px;flex-wrap:wrap}
.ust small{color:var(--soluk);letter-spacing:.12em;text-transform:uppercase;font-size:.72rem;font-weight:700}
.ust h1{font-family:var(--serif);font-size:clamp(1.9rem,4.5vw,2.6rem);line-height:1.1;font-weight:600}
.ust p{color:var(--soluk)}
.btn{min-height:46px;padding:10px 18px;border-radius:14px;border:1px solid var(--cizgi);background:var(--kart);font-weight:600}
.btn.ana-d{background:var(--vurgu);color:var(--vurgu-yazi);border-color:var(--vurgu)}
.btn.kucuk{min-height:38px;padding:6px 14px;font-size:.9rem}
.izgara{display:grid;gap:18px} .iki{grid-template-columns:minmax(0,1.5fr) minmax(0,1fr)} .uc{grid-template-columns:repeat(3,minmax(0,1fr))} .ikili{grid-template-columns:1fr 1fr}
.kart{background:var(--kart);border:1px solid var(--cizgi);border-radius:var(--r);padding:18px 20px;box-shadow:var(--golge)}
.kart h3{font-family:var(--serif);font-size:1.15rem;font-weight:600;margin-bottom:4px}
.alt{color:var(--soluk);font-size:.9rem}
.etk{font-size:.7rem;letter-spacing:.12em;text-transform:uppercase;color:var(--soluk);font-weight:700;margin-bottom:6px}

/* ---------- hero ---------- */
.hero{background:linear-gradient(155deg,var(--hero-a),var(--hero-b));color:var(--hero-yazi);border-radius:26px;padding:24px;box-shadow:var(--golge);display:grid;grid-template-columns:1fr auto;gap:12px 18px;align-items:center}
.hero .etk{color:var(--hero-soluk)}
.hero .say{font-family:var(--serif);font-weight:600;font-size:clamp(3rem,9vw,4.8rem);line-height:1;letter-spacing:-.02em;font-variant-numeric:lining-nums tabular-nums}
.hero .say small{font-size:.5em;color:var(--hero-soluk)}
.hero .alt{color:var(--hero-soluk)}
.halka{--p:20;width:92px;height:92px;border-radius:50%;background:conic-gradient(var(--hero-yazi) calc(var(--p)*1%),color-mix(in srgb,var(--hero-yazi) 22%,transparent) 0);display:grid;place-items:center;text-align:center}
.halka div{width:74px;height:74px;border-radius:50%;background:var(--hero-a);display:grid;place-content:center;font-size:.72rem;line-height:1.2;color:var(--hero-soluk)}
.halka b{color:var(--hero-yazi);font-size:1rem;display:block}
.hero .tam{grid-column:1/-1}
.guven{display:inline-flex;gap:6px;align-items:center;background:rgba(255,255,255,.14);border-radius:99px;padding:4px 12px;font-size:.82rem;margin-top:6px}
.guven i{width:8px;height:8px;border-radius:50%;background:#9ff0c9}
.dokum{background:var(--hero-ic,rgba(0,0,0,.16));border-radius:16px;padding:6px 14px;margin-top:6px}
.dokum div{display:flex;justify-content:space-between;padding:6px 0;color:var(--hero-soluk);font-size:.92rem}
.dokum b{color:var(--hero-yazi);font-variant-numeric:tabular-nums} .dokum .t{border-top:1px solid color-mix(in srgb,var(--hero-yazi) 28%,transparent);font-weight:700;color:var(--hero-yazi)}
.hizli{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.hizli input{flex:1 1 140px;min-height:50px;border-radius:14px;border:0;padding:0 16px;font:600 1.1rem var(--serif);background:#fff;color:#23302b}
.hizli .btn{border:0;background:color-mix(in srgb,var(--hero-yazi) 18%,transparent);color:var(--hero-yazi)} .hizli .btn.b{background:var(--hero-yazi);color:var(--hero-a)}

/* ---------- listeler ---------- */
.sat{display:flex;gap:12px;align-items:center;padding:12px 0;border-top:1px solid var(--cizgi)} .sat:first-of-type{border-top:0}
.sat .g{flex:1;min-width:0} .sat b{display:block} .sat small{color:var(--soluk)}
.tut{font-variant-numeric:tabular-nums;font-weight:600}
.tarih{width:46px;height:50px;border-radius:12px;background:var(--vurgu-acik);color:var(--vurgu);display:grid;place-content:center;text-align:center;font-size:.66rem;font-weight:700;letter-spacing:.06em;flex:none}
.tarih b{font-family:var(--serif);font-size:1.15rem;line-height:1}
.rozet{display:inline-block;border-radius:99px;padding:2px 10px;font-size:.74rem;font-weight:700;background:var(--vurgu-acik);color:var(--vurgu)} .rozet.s{background:var(--uyari);color:var(--uyari-yazi)}
.cek{width:26px;height:26px;border-radius:8px;border:2px solid var(--cizgi);background:var(--kart);flex:none;display:grid;place-items:center;padding:0}
.cek[aria-pressed=true]{background:var(--vurgu);border-color:var(--vurgu);color:#fff} .cek[aria-pressed=true]::after{content:"✓";font-size:.9rem}
.cek[aria-pressed=true]+.g b{text-decoration:line-through;color:var(--soluk)}
.bar{height:10px;border-radius:99px;background:var(--vurgu-acik);overflow:hidden;margin:8px 0 4px} .bar i{display:block;height:100%;background:var(--vurgu);border-radius:99px}
.bar.k i{background:var(--kotu)}
.mini{background:var(--kart);border:1px solid var(--cizgi);border-radius:16px;padding:12px 14px;box-shadow:var(--golge)}
.mini b{font-family:var(--serif);font-size:1.5rem;display:block;line-height:1.2}
.mini.v{background:var(--vurgu-acik)} .mini.s{background:var(--uyari)}
.chips{display:flex;gap:8px;flex-wrap:wrap} .chip{border:1px solid var(--cizgi);background:var(--kart);border-radius:99px;min-height:44px;padding:6px 16px;font-weight:600} .chip[aria-pressed=true]{background:var(--vurgu);color:var(--vurgu-yazi);border-color:var(--vurgu)}
.buyuk{font-family:var(--serif);font-weight:600;font-size:clamp(2.4rem,7vw,3.6rem);line-height:1.05}
input[type=range]{width:100%;accent-color:var(--vurgu);min-height:36px}
.takvim{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;text-align:center}
.takvim span{font-size:.7rem;color:var(--soluk);font-weight:700;letter-spacing:.08em}
.takvim div{min-height:62px;border-radius:12px;background:var(--kart);border:1px solid var(--cizgi);padding:6px;text-align:left;font-size:.82rem;position:relative}
.takvim div.m{background:var(--vurgu);color:var(--vurgu-yazi);border-color:var(--vurgu)} .takvim div.f::after{content:"";position:absolute;right:8px;bottom:8px;width:9px;height:9px;border-radius:50%;background:var(--kotu)}
.takvim div.o{opacity:.35}
.hafta{display:grid;grid-template-columns:repeat(13,1fr);gap:5px} .hafta i{aspect-ratio:1;border-radius:7px;background:var(--vurgu-acik);display:block} .hafta i.d{background:var(--vurgu)}
.zaman{font-family:var(--serif);font-size:3.2rem;font-weight:600;line-height:1}
.alt-sekme{display:none}

/* ---------- mobil ---------- */
@media (max-width:900px){
  .uyg{grid-template-columns:1fr} .yan{display:none}
  .iki,.uc,.ikili{grid-template-columns:1fr} .uc.mob{grid-template-columns:repeat(3,1fr)}
  .ana{padding:20px 16px 120px}
  .alt-sekme{display:grid;grid-template-columns:repeat(5,1fr);position:fixed;left:0;right:0;bottom:0;background:var(--panel);border-top:1px solid var(--cizgi);padding:6px 6px calc(6px + env(safe-area-inset-bottom));z-index:5}
  .alt-sekme button{border:0;background:none;display:grid;justify-items:center;gap:2px;min-height:52px;font-size:.7rem;color:var(--soluk);border-radius:12px}
  .alt-sekme button[aria-current=page]{color:var(--vurgu);font-weight:700} .alt-sekme svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
  .fab{position:fixed;right:18px;bottom:84px;width:58px;height:58px;border-radius:50%;border:0;background:var(--vurgu);color:var(--vurgu-yazi);font-size:2rem;line-height:1;box-shadow:0 8px 20px rgba(0,0,0,.25);z-index:6}
  .hero{grid-template-columns:1fr auto;padding:20px}
}
@media (min-width:901px){.fab{display:none}}

/* ---------- ortak bilesenler (ekran modulleri bunlari kullanir) ---------- */
html[data-yazi="buyuk"] { font-size: 19px; }
html[data-baslik="yuvarlak"] { --serif: ui-rounded, "SF Pro Rounded", "Nunito", system-ui, sans-serif; }
html[data-baslik="duz"] { --serif: system-ui, -apple-system, "Segoe UI", sans-serif; }
.grid-iki { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
label.alan { display: block; margin: 0 0 12px; }
label.alan > span { display: flex; align-items: center; gap: 6px; font-size: .85rem; color: var(--soluk); margin-bottom: 4px; font-weight: 600; }
input.gir, select.gir, textarea.gir { width: 100%; min-height: 48px; padding: 10px 14px; border-radius: 14px; border: 1px solid var(--cizgi); background: var(--panel); color: var(--yazi); font: inherit; }
textarea.gir { min-height: 90px; resize: vertical; }
input.gir:focus-visible, select.gir:focus-visible, textarea.gir:focus-visible, button:focus-visible, a:focus-visible { outline: 3px solid var(--vurgu); outline-offset: 2px; }
.btn.tehlike { color: var(--kotu); }
.btn:disabled { opacity: .5; cursor: not-allowed; }
.bos { text-align: center; color: var(--soluk); padding: 22px 8px; }
.sag { display: flex; gap: 6px; flex-wrap: wrap; justify-content: flex-end; }
.tut.eksi { color: var(--kotu); } .tut.arti { color: var(--iyi); }

/* ⓘ bilgi dugmesi + balon */
.bilgi { display: inline-grid; place-items: center; width: 22px; height: 22px; min-height: 22px; padding: 0; border-radius: 50%; border: 1.5px solid var(--soluk); background: transparent; color: var(--soluk); font: italic 700 .75rem/1 var(--serif); cursor: pointer; vertical-align: middle; position: relative; }
.bilgi::after { content: ""; position: absolute; inset: -11px; }
/* Borc urunu: dokunma alani gercekten 44x44 (gorunen daire 22px kalir, yerlesim ayni: negatif kenar boslugu) */
html[data-urun="borc"] .bilgi { width: 44px; height: 44px; min-height: 44px; margin: -11px; border: 0; background: transparent; isolation: isolate; }
html[data-urun="borc"] .bilgi::after { inset: 11px; z-index: -1; border: 1.5px solid currentColor; border-radius: 50%; }
html[data-urun="borc"] .bilgi[aria-expanded="true"] { background: transparent; }
html[data-urun="borc"] .bilgi[aria-expanded="true"]::after { background: var(--vurgu); border-color: var(--vurgu); }
.bilgi[aria-expanded="true"] { background: var(--vurgu); border-color: var(--vurgu); color: var(--vurgu-yazi); }
.balon { position: absolute; z-index: 30; max-width: min(300px, calc(100vw - 32px)); background: var(--yazi); color: var(--bg); border-radius: 14px; padding: 10px 14px; font-size: .88rem; line-height: 1.4; box-shadow: 0 10px 30px rgba(0,0,0,.3); font-weight: 400; letter-spacing: 0; text-transform: none; }
.hero .bilgi { border-color: var(--hero-soluk); color: var(--hero-soluk); }

/* iletisim kutusu */
.perde { position: fixed; inset: 0; background: rgba(0,0,0,.45); z-index: 50; display: grid; place-items: end center; }
.kutu { background: var(--kart); color: var(--yazi); width: min(520px, 100%); max-height: 92vh; overflow: auto; border-radius: 24px 24px 0 0; padding: 22px 20px calc(22px + env(safe-area-inset-bottom)); box-shadow: 0 -10px 40px rgba(0,0,0,.3); }
.kutu h2 { font-family: var(--serif); font-size: 1.4rem; margin-bottom: 14px; }
.kutu .alt-sira { display: flex; gap: 10px; justify-content: flex-end; margin-top: 16px; }
@media (min-width: 700px) { .perde { place-items: center; } .kutu { border-radius: 24px; } }

/* bildirim + geri al */
#bildirim { position: fixed; left: 50%; transform: translateX(-50%); bottom: 96px; z-index: 60; background: var(--yazi); color: var(--bg); border-radius: 16px; padding: 10px 16px; display: flex; gap: 12px; align-items: center; box-shadow: 0 10px 30px rgba(0,0,0,.3); max-width: calc(100vw - 24px); }
#bildirim button { background: none; border: 0; color: var(--bg); text-decoration: underline; font-weight: 700; min-height: 36px; padding: 0 6px; }
@media (min-width: 901px) { #bildirim { bottom: 28px; } }
.ust-arac { display: flex; gap: 8px; align-items: center; }
.btn.ikon { width: 46px; padding: 0; display: inline-grid; place-items: center; }
.uyari-seridi { background: var(--uyari); color: var(--uyari-yazi); border-radius: 14px; padding: 10px 14px; margin-bottom: 14px; font-size: .92rem; }
.sirala-ust { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }

@media print {
  .yan, .alt-sekme, .fab, .arac, #bildirim, .ust .btn, .sag, .bilgi, button.btn { display: none !important; }
  .uyg { display: block; } body, html { background: #fff; color: #000; }
  .ana { max-width: none; padding: 0; } .kart, .hero { box-shadow: none; border: 1px solid #999; break-inside: avoid; }
  .hero { background: #fff !important; color: #000 !important; } .hero * { color: #000 !important; }
  @page { margin: 14mm; }
}
/* dar ekranda ic ice izgara icerik genisligine tasmasin (hero yan karta binmesin) */
.izgara:not(.iki):not(.uc):not(.ikili) { grid-template-columns: minmax(0, 1fr); }
.izgara > * { min-width: 0; }
@media (min-width: 901px) and (max-width: 1180px) { .izgara.iki { grid-template-columns: minmax(0, 1fr); } }

/* ADHD ekranlari (plan, rout, pause, tax): yalniz ek kurallar */
.cek { position: relative; }
.cek::before { content: ""; position: absolute; inset: -10px; }
.ekle-form { display: flex; gap: 8px; margin: 10px 0; }
.ekle-form .gir { flex: 1; min-width: 0; }
.zaman-kutu { text-align: center; margin: 12px 0; }
.zaman-kutu .zaman[data-bitti="1"] { color: var(--iyi); }
.adhd-not { color: var(--soluk); font-size: .9rem; margin-top: 8px; }
.adhd-baslik { display: flex; align-items: center; gap: 6px; margin-bottom: 4px; }
.adhd-baslik h3 { margin: 0; }
.sat .btn.kucuk { flex: none; }
.sonuc-ozet { font-family: var(--serif); font-size: 1.15rem; margin-bottom: 4px; }

/* ---------- coklu tema serit (Theme + Calm), tema kartlari, Transfer code. Yalniz window.COKLU / window.CALM / Transfer'de kullanilir. ---------- */
.tema-serit { display: flex; justify-content: flex-end; align-items: center; gap: 8px; flex-wrap: wrap; margin: -6px 0 16px; position: relative; z-index: 3; }
.serit-btn { display: inline-flex; align-items: center; gap: 8px; min-height: 44px; padding: 6px 16px 6px 8px; border-radius: 99px; border: 1px solid var(--cizgi); background: var(--kart); color: var(--yazi); font: 600 .9rem/1.1 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; letter-spacing: 0; text-transform: none; white-space: nowrap; }
.serit-btn .renk { width: 28px; height: 28px; flex: none; border-radius: 50%; background: conic-gradient(var(--m1) 0 25%, var(--m2) 0 50%, var(--m3) 0 75%, var(--m4) 0); box-shadow: 0 0 0 2px var(--kart), 0 0 0 3px var(--cizgi); }
.serit-btn .serit-onek { color: var(--soluk); font-weight: 500; }
.serit-btn svg { width: 22px; height: 22px; flex: none; stroke: currentColor; fill: none; stroke-width: 1.9; stroke-linecap: round; stroke-linejoin: round; }
.calm-btn { padding-left: 12px; background: var(--vurgu-acik); color: var(--vurgu); border-color: var(--vurgu); }
.calm-btn[data-calm="acik"] { background: var(--vurgu); color: var(--vurgu-yazi); }
.serit-btn:hover { filter: brightness(.97); }
.tema-serit .bilgi { flex: none; }
@media (max-width: 480px) { .serit-btn .serit-onek { display: none; } .serit-btn { padding-right: 14px; } }
@media print { .tema-serit { display: none !important; } }

/* coklu tema kartlari: onizleme = o temanin hero zemini + 4 motif rengi + ikon */
.coklu-izgara { grid-template-columns: repeat(auto-fill, minmax(132px, 1fr)); }
.coklu-izgara .tema-kart { min-height: 96px; align-content: start; font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
.coklu-izgara .tema-kart .su { display: flex; align-items: center; justify-content: space-between; height: 46px; padding: 0 10px; border: 1px solid var(--cizgi); color: var(--hero-yazi); }
.coklu-izgara .tema-kart .su .renk { width: 30px; height: 30px; border-radius: 50%; background: conic-gradient(var(--m1) 0 25%, var(--m2) 0 50%, var(--m3) 0 75%, var(--m4) 0); box-shadow: 0 0 0 2px var(--kart); }
.coklu-izgara .tema-kart .su svg { position: static; width: 24px; height: 24px; stroke: var(--hero-yazi); fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; opacity: 1; }
.coklu-izgara .tema-kart b { font-size: .9rem; color: var(--yazi); }
.coklu-izgara .tema-kart { position: relative; }
.coklu-izgara .tema-kart[aria-pressed="true"]::after { content: "\2713"; position: absolute; right: 8px; bottom: 8px; width: 22px; height: 22px; border-radius: 50%; display: grid; place-items: center; background: var(--vurgu); color: var(--vurgu-yazi); font: 700 .8rem/1 system-ui, sans-serif; }

/* Transfer code */
.transfer-kod { font: 500 .78rem/1.35 ui-monospace, "Cascadia Mono", Consolas, monospace; word-break: break-all; min-height: 120px; }
.transfer-hata { background: var(--uyari); color: var(--uyari-yazi); border-radius: 12px; padding: 10px 14px; margin-top: 10px; font-size: .92rem; }
.transfer-tamam::before { content: "\2713\00a0"; }
.transfer-tamam { background: var(--vurgu-acik); color: var(--vurgu); border-radius: 12px; padding: 10px 14px; margin-top: 10px; font-size: .92rem; font-weight: 600; }
.transfer-bolum { margin-top: 16px; padding-top: 14px; border-top: 1px solid var(--cizgi); }

/* ---------- tema susleri (motif.js) ---------- */
body { position: relative; }
#deko { position: absolute; top: var(--demo-h, 0px); left: 0; right: 0; overflow: hidden; pointer-events: none; z-index: 0; }
#deko svg { display: block; }
.ana { position: relative; z-index: 1; }
.ip { animation: salin 7s ease-in-out infinite alternate; }
@keyframes salin { from { transform: rotate(-1.4deg); } to { transform: rotate(1.4deg); } }
@media (prefers-reduced-motion: reduce) { .ip { animation: none; } }
html[data-deko="kapali"] #deko { display: none; }
.hero { position: relative; }
.hero > * { position: relative; }
.hero > .kose { position: absolute; inset: 0; border-radius: inherit; overflow: hidden; pointer-events: none; z-index: 0; }
.hero > .kose svg { position: absolute; right: -14px; bottom: -22px; width: 150px; height: 120px; opacity: .22; }
html[data-deko="acik"] .ana { padding-top: 66px; }
.bos .kume { display: flex; justify-content: center; margin-bottom: 6px; opacity: .9; }
.marka i { position: relative; overflow: hidden; display: grid; place-items: center; }
.marka i svg { width: 100%; height: 100%; }
.tema-izgara { display: grid; grid-template-columns: repeat(auto-fill, minmax(118px, 1fr)); gap: 10px; margin: 10px 0 4px; }
.tema-kart { display: grid; gap: 6px; text-align: left; padding: 8px; border-radius: 14px; border: 2px solid var(--cizgi); background: var(--bg); color: var(--yazi); min-height: 44px; }
.tema-kart[aria-pressed="true"] { border-color: var(--vurgu); box-shadow: 0 0 0 2px var(--vurgu-acik); }
.tema-kart .su { height: 34px; border-radius: 9px; background: linear-gradient(155deg, var(--hero-a), var(--hero-b)); position: relative; overflow: hidden; }
.tema-kart .su svg { position: absolute; right: 2px; top: 1px; width: 44px; height: 32px; opacity: .95; }
.tema-kart b { font-size: .84rem; line-height: 1.2; }
.nav { position: relative; overflow: hidden; }
.nav > * { position: relative; }
.nav > .nav-susu { position: absolute; inset: 0; pointer-events: none; opacity: .62; z-index: 0; }
.nav > .nav-susu svg { display: block; }
.hero.eksik { --hero-a: #6d1f1b; --hero-b: #a13a30; --hero-yazi: #ffffff; --hero-soluk: #f7ddd9; }
.nav > .nav-susu svg { width: 100%; height: 100%; stroke: none; }
.hero .say { font-size: clamp(2.4rem, 7vw, 4.8rem); }
/* ---------- gercek fotograf temalari (JS: html[data-foto="1"]) ---------- */
html[data-foto="1"] .hero { background-image: var(--foto-hero-ov), var(--foto-hero); background-size: cover; background-position: center top; }
html[data-foto="1"] .nav[aria-current=page] { background-image: var(--foto-nav-ov), var(--foto-nav); background-size: cover; background-position: center 35%; }
html[data-foto="1"] .hero.eksik { background-image: linear-gradient(155deg, rgba(109,31,27,.92), rgba(161,58,48,.82)), var(--foto-hero); }
.ip image { image-rendering: auto; }
/* tum sayfa icin cok silik desen arka plani (foto/<tema>/back.webp); kartlar opak oldugundan yalniz bosluklarda gorunur */
html[data-foto-back="1"] body::before { content: ""; position: fixed; inset: 0; background: var(--foto-back) center / cover; opacity: .085; pointer-events: none; z-index: 0; }
html[data-foto-back="1"][data-mod="koyu"] body::before { opacity: .06; filter: brightness(.35); }
/* yalniz menu: ayni desen sol menunun arka planinda, %90 panel rengiyle ortulu (cok silik) */
html[data-foto-menu="1"] .yan { background: linear-gradient(color-mix(in srgb, var(--panel) 88%, transparent), color-mix(in srgb, var(--panel) 88%, transparent)), var(--foto-back) center / cover, var(--panel); }

/* RETRO (D1 Retro Bloom): 70ler cicek gucu, gokkusagi yaylari, damla kartlar. Koyu: gece mor. */
[data-theme="retro"] {
  --bg:#fff0d6; --panel:#fff7e6; --kart:#ffffff; --yazi:#3b1a0c; --soluk:#7a4a2a; --cizgi:#3b1a0c;
  --vurgu:#b82250; --vurgu-yazi:#fff0d6; --vurgu-acik:#ffe7b0;
  --hero-a:#b82250; --hero-b:#b82250; --hero-yazi:#fff0d6; --hero-soluk:#ffe3c2;
  --iyi:#11693f; --kotu:#b3261e; --uyari:#ffd9a0; --uyari-yazi:#5a2a00;
  --golge:5px 5px 0 #3b1a0c; --r:30px;
  --m1:#f78c2a; --m2:#ffc93c; --m3:#06a77d; --m4:#ef476f; --on:#3b1a0c; --gol:#3b1a0c;
}
[data-theme="retro"][data-mod="koyu"] {
  --bg:#2a1236; --panel:#341a44; --kart:#3d2150; --yazi:#fff0d6; --soluk:#e0c3a8; --cizgi:#fff0d6;
  --vurgu:#ff8fb3; --vurgu-yazi:#2a1236; --vurgu-acik:#55306b;
  --hero-a:#b82250; --hero-b:#b82250; --hero-yazi:#fff0d6; --hero-soluk:#ffe3c2;
  --iyi:#7de0b0; --kotu:#ff9a8d; --uyari:#55306b; --uyari-yazi:#ffe7b0;
  --golge:5px 5px 0 #12061a; --r:30px;
  --m1:#f78c2a; --m2:#ffc93c; --m3:#06a77d; --m4:#ef476f; --on:#3b1a0c; --gol:#12061a;
}

/* RETRO (D1 Retro Bloom): kalin kontur, sert golge, gokkusagi, gunes madalyonu. Pastel yuzeylerde yazi sabit --on.
 * Sekil kurali: yazi tasiyan hicbir kutu elips DEGIL (oran genislige gore ezilir, yazi kenara deger). Yazili kutular = sabit yaricapli
 * yuvarlak dikdortgen; daire yalniz sabit en-boylu (aspect-ratio 1) ogelerde. Iki golge boyu: dugme 3px, kart 5px. */
[data-theme="retro"] { --kenar: 2.5px solid var(--cizgi); --serif: "Fraunces", ui-rounded, Georgia, serif; --rk: 28px; --rd: 22px; }
[data-theme="retro"] body { background: var(--bg); font-family: ui-rounded, "SF Pro Rounded", "Nunito", "Segoe UI", system-ui, sans-serif; }
[data-theme="retro"], [data-theme="retro"] body { overflow-x: clip; }
[data-theme="retro"] .uyg { padding: 22px 22px 0; gap: 28px; }
/* yan menu: tum maddeler erisilebilir (kaydirilir), gokkusagi en altta akista */
[data-theme="retro"] .yan { background: var(--panel); border: var(--kenar); border-radius: 32px; box-shadow: var(--golge); height: auto; max-height: calc(100vh - 44px); top: 22px; align-self: start; overflow-x: hidden; overflow-y: auto; scrollbar-width: thin; scrollbar-color: var(--soluk) transparent; padding: 20px 14px 0; }
@media (min-width: 901px) { [data-theme="retro"] .yan { display: flex; flex-direction: column; } }
[data-theme="retro"] .yan > * { position: relative; z-index: 1; flex-shrink: 0; }
[data-theme="retro"] .marka i { width: 42px; height: 42px; flex: none; border-radius: 50%; background: var(--m2); border: var(--kenar); display: grid; place-items: center; overflow: hidden; }
[data-theme="retro"] .marka i svg { width: 34px; height: 34px; }
[data-theme="retro"] .basit { background: var(--bg); border: 2px solid var(--cizgi); border-radius: var(--rd); }
[data-theme="retro"] .sw { background: var(--kart); border: 2px solid var(--cizgi); }
[data-theme="retro"] .sw::after { background: var(--yazi); }
[data-theme="retro"] .sw[aria-pressed=true] { background: var(--m3); }
[data-theme="retro"] .sw[aria-pressed=true]::after { background: #fff0d6; }
[data-theme="retro"] .grup { font-weight: 800; margin-top: 14px; }
[data-theme="retro"] .nav { border-radius: var(--rd); border: 2.5px solid transparent; font-weight: 700; padding: 8px 14px; }
[data-theme="retro"] .nav:hover { background: var(--bg); border-color: color-mix(in srgb, var(--cizgi) 25%, transparent); }
[data-theme="retro"] .nav[aria-current=page] { background: var(--vurgu); color: var(--vurgu-yazi); border-color: var(--cizgi); box-shadow: 3px 3px 0 var(--gol); margin: 2px 3px 5px 0; width: calc(100% - 3px); }
[data-theme="retro"] .nav[aria-current=page] svg { stroke: currentColor; }
[data-theme="retro"] .nav .nav-susu { display: none; }
[data-theme="retro"] .ust small { display: inline-block; background: var(--m2); color: var(--on); border: var(--kenar); border-radius: 99px; padding: 5px 14px; font-weight: 800; line-height: 1.2; }
[data-theme="retro"] .ust h1 { margin-top: 12px; }
/* dugmeler: tek satirda hap, iki satira kirilirsa yaricap sabit kalir (metin kavise degmez) */
[data-theme="retro"] .btn { border: var(--kenar); border-radius: var(--rd); min-height: 44px; padding-left: 18px; padding-right: 18px; background: var(--m2); color: var(--on); font-weight: 800; box-shadow: 3px 3px 0 var(--gol); transition: transform .12s, box-shadow .12s; }
[data-theme="retro"] .btn:active { transform: translate(2px,2px); box-shadow: 1px 1px 0 var(--gol); }
[data-theme="retro"] .btn.ana-d { background: var(--m2); color: var(--on); }

[data-theme="retro"] .kart { border: var(--kenar); border-radius: var(--rk); box-shadow: var(--golge); background: var(--kart); }
[data-theme="retro"] .kart h3 { font-family: ui-rounded, "SF Pro Rounded", "Nunito", system-ui, sans-serif; font-weight: 800; color: var(--vurgu); }
[data-theme="retro"] .sat { border-top: 2px dashed color-mix(in srgb, var(--cizgi) 35%, transparent); }
[data-theme="retro"] .sat:first-of-type { border-top: 0; }
/* tarih: gercek daire (sabit en-boy) */
[data-theme="retro"] .tarih { width: 50px; height: 50px; aspect-ratio: 1; background: var(--m3); color: var(--on); border-radius: 50%; border: 2px solid var(--cizgi); font-size: .6rem; }
[data-theme="retro"] .tarih b { font-size: 1.05rem; }
[data-theme="retro"] .rozet { background: var(--m2); color: var(--on); border: 2px solid var(--cizgi); padding: 2px 10px; line-height: 1.35; }
[data-theme="retro"] .rozet.s { background: var(--uyari); color: var(--uyari-yazi); }
[data-theme="retro"] .cek { border: var(--kenar); border-radius: 50%; background: #fff; color: #3b1a0c; }
[data-theme="retro"] .cek[aria-pressed=true] { background: var(--m3); color: var(--on); }

[data-theme="retro"] .bar { height: 18px; border: 2.5px solid var(--cizgi); background: var(--kart); border-radius: 99px; overflow: hidden; padding: 2px; box-sizing: border-box; }
[data-theme="retro"] .bar i { background: repeating-linear-gradient(-45deg, var(--m4) 0 7px, color-mix(in srgb, var(--m4) 78%, #fff) 7px 12px); border-radius: 99px; min-width: 8px; }

/* HERO: canli pembe kart; cicek madalyonu izgaranin 2. sutununda akista (metne/koseye binmez) */

[data-theme="retro"] .hero .alt { font-weight: 600; }
[data-theme="retro"] .hero .guven { background: #fff0d6; color: #3b1a0c; border: 2px solid #3b1a0c; border-radius: 16px; padding: 5px 14px; font-weight: 700; line-height: 1.3; }

[data-theme="retro"] .dokum { background: transparent; padding: 0; border-radius: 0; }

[data-theme="retro"] .dokum .t b { color: var(--m2); font-family: var(--serif); font-size: 1.15rem; }

[data-theme="retro"] .hizli .btn { background: var(--m2); color: #3b1a0c; border: 2.5px solid #3b1a0c; box-shadow: 3px 3px 0 #3b1a0c; }

/* mini kutular (Next bill / Spent today / Next payday ve ozet kutulari): sabit yaricapli kart + ustte kucuk gun dogumu isareti.
 * Yazi boyu kutu genisligine gore (container query) olcekler; kirpma yok, son care satir kirma. */
[data-theme="retro"] .mini { position: relative; box-sizing: border-box; min-width: 0; container-type: inline-size; border: var(--kenar); border-radius: 24px; box-shadow: 4px 4px 0 var(--gol); color: var(--on); padding: 34px 12px 16px; text-align: center; display: flex; flex-direction: column; align-items: center; gap: 2px; overflow-wrap: anywhere; }
[data-theme="retro"] .mini::before { content: ""; position: absolute; top: 9px; left: 50%; width: 34px; height: 17px; transform: translateX(-50%); border-radius: 34px 34px 0 0; background: radial-gradient(circle at 50% 100%, var(--on) 0 4px, transparent 4.5px 7.5px, var(--on) 8px 10px, transparent 10.5px 13.5px, var(--on) 14px 16px, transparent 16.5px); opacity: .85; }
[data-theme="retro"] .mini:nth-child(3n+1) { background: var(--m1); }

[data-theme="retro"] .mini .etk, [data-theme="retro"] .mini .alt, [data-theme="retro"] .mini b { color: inherit; }

[data-theme="retro"] .mini b { font-size: clamp(1rem, 16cqi, 1.6rem); line-height: 1.15; letter-spacing: -.01em; }

[data-theme="retro"] .mini .bilgi { color: inherit; border-color: currentColor; }

/* alt sekme + fab */

[data-theme="retro"] .hero > .dil-cicek-b { grid-column: 2; grid-row: 1; align-self: start; justify-self: end; width: 128px; aspect-ratio: 1; border-radius: 50%; border: 2.5px solid #3b1a0c; box-shadow: 4px 4px 0 #3b1a0c; background: #fff0d6; overflow: hidden; z-index: 1; }

}

  [data-theme="retro"] .mini .etk { letter-spacing: .06em; font-size: .58rem; }
  [data-theme="retro"] .mini .alt { font-size: .74rem; }
  [data-theme="retro"] .kart { border-radius: 24px; }
}

[data-theme="retro"] .ust-arac { flex-wrap: wrap; row-gap: 10px; }
[data-theme="retro"] .ust-arac .btn, [data-theme="retro"] .ust-arac .chip { white-space: nowrap; }

/* kisisel */

.kb { position: relative; margin: 0 0 20px; padding: 20px 60px 20px 26px; border-radius: var(--r); background: var(--kart); color: var(--yazi);
  border: 1px solid var(--cizgi); box-shadow: var(--golge); overflow: hidden; cursor: pointer; isolation: isolate; z-index: 2; }
.kb[data-kb-hiza="orta"] { text-align: center; padding: 22px 56px 20px; }
.kb-ic { position: relative; z-index: 1; min-width: 0; }
.kb-ust { display: flex; align-items: center; gap: 14px; min-width: 0; }
.kb[data-kb-hiza="orta"] .kb-ust { justify-content: center; }
.kb-baslik { margin: 0; font-family: var(--serif); font-weight: 600; font-size: clamp(1.55rem, 5.2vw, 2.45rem); line-height: 1.12; letter-spacing: -.01em; overflow-wrap: anywhere; word-break: normal; min-width: 0; }
.kb-ad { color: var(--vurgu); }
.kb-tire { display: inline-block; max-width: 100%; }
.kb-emoji { flex: none; display: inline-grid; place-items: center; width: 1.95em; height: 1.95em; border-radius: 50%; font-size: clamp(1.2rem, 3.8vw, 1.55rem); line-height: 1;
  font-family: "Segoe UI Emoji", "Apple Color Emoji", "Noto Color Emoji", sans-serif; background: var(--vurgu-acik); box-shadow: 0 0 0 3px var(--kart), 0 0 0 4px var(--cizgi); }
.kb-cumle { margin: 6px 0 0; color: var(--soluk); font-size: 1.02rem; line-height: 1.4; font-style: italic; overflow-wrap: anywhere; }
.kb-rozet-sira { margin: 10px 0 0; }
.kb-rozet { display: inline-flex; align-items: center; gap: 6px; max-width: 100%; padding: 5px 13px 5px 10px; border-radius: 99px; background: var(--vurgu); color: var(--vurgu-yazi);
  font: 700 .8rem/1.25 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; letter-spacing: .02em; overflow-wrap: anywhere; text-align: left; }
.kb-rozet-ikon { flex: none; width: 14px; height: 14px; fill: currentColor; stroke: none; }
.kb-sus { display: none; }
.kb-sus svg { display: block; width: 100%; height: 100%; }
.kb-duzen { position: absolute; top: 8px; right: 8px; z-index: 3; width: 44px; height: 44px; border-radius: 50%; border: 1px solid transparent; background: transparent; color: inherit; opacity: .72;
  display: grid; place-items: center; cursor: pointer; padding: 0; }
.kb-duzen:hover, .kb-duzen:focus-visible { opacity: 1; background: var(--vurgu-acik); color: var(--vurgu); border-color: var(--vurgu); }
.kb-duzen svg { width: 19px; height: 19px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
.kb:focus-within .kb-duzen { opacity: 1; }
/* yeni kaydedilince bir kez: kucuk "pop" (hareket azaltta yok) */
.kb.kb-yeni { animation: kb-pop .5s cubic-bezier(.2,.9,.3,1.3) both; }
@keyframes kb-pop { from { transform: scale(.96); opacity: .4; } to { transform: none; opacity: 1; } }

/* ilk acilis ipucu: nazik, tek satir, atlanabilir */
.kb-ipucu { display: flex; align-items: center; gap: 2px; margin: 0 0 14px; flex-wrap: wrap; position: relative; z-index: 3; }
.kb-ipucu-ac { display: inline-flex; align-items: center; gap: 8px; min-height: 44px; padding: 6px 16px 6px 12px; border-radius: 99px; border: 1px dashed var(--vurgu);
  background: var(--vurgu-acik); color: var(--vurgu); font: 600 .9rem/1.2 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; cursor: pointer; text-align: left; }
.kb-ipucu-ac svg { flex: none; width: 17px; height: 17px; fill: none; stroke: currentColor; stroke-width: 1.9; stroke-linecap: round; stroke-linejoin: round; }
.kb-ipucu-x { width: 44px; height: 44px; border-radius: 50%; border: 0; background: transparent; color: var(--soluk); font: 400 1.4rem/1 system-ui, sans-serif; cursor: pointer; }
.kb-ipucu-x:hover, .kb-ipucu-x:focus-visible { background: var(--vurgu-acik); color: var(--vurgu); }

/* duzenleme kutusu + Settings karti */
.kb-form .alan { margin-bottom: 10px; }
.kb-alan-ic { display: block; position: relative; }
.kb-sayac { position: absolute; right: 12px; top: 50%; transform: translateY(-50%); font-size: .75rem; color: var(--soluk); pointer-events: none; background: var(--kart); padding-left: 4px; }
.kb-sayac:empty { display: none; }
.kb-emojiler { margin: 6px 0 10px; gap: 6px; }
.kb-emoji-chip { min-width: 44px; min-height: 44px; padding: 0 10px; font-size: 1.2rem; font-family: "Segoe UI Emoji", "Apple Color Emoji", "Noto Color Emoji", system-ui, sans-serif; }
.kb-emoji-chip[aria-label] { font-size: .85rem; }
.kb-emoji-gir { max-width: 140px; }
.kb-oniz-yer { margin: 0 0 14px; pointer-events: none; }
.kb-oniz-yer .kb { margin: 6px 4px 6px; cursor: default; }
.kb-onizleme { padding-right: 26px; }
.kb-onizleme[data-kb-hiza="orta"] { padding-left: 22px; padding-right: 22px; }
.kb-onizleme .kb-baslik { font-size: clamp(1.25rem, 4.6vw, 1.7rem); }
.kb-kutu { max-width: 560px; }
.kb-ayrac { height: 1px; background: var(--cizgi); margin: 18px 0 12px; }
.kb-renkler { display: grid; grid-template-columns: repeat(auto-fill, minmax(84px, 1fr)); gap: 8px; margin-top: 8px; }
.kb-renk { display: grid; justify-items: center; gap: 6px; min-height: 76px; padding: 10px 4px 8px; border-radius: 14px; border: 1px solid var(--cizgi); background: var(--kart); color: var(--yazi);
  font: 600 .78rem/1.15 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; cursor: pointer; }
.kb-renk[aria-pressed="true"] { border: 2px solid var(--vurgu); padding: 9px 3px 7px; }
.kb-renk-top { position: relative; width: 34px; height: 34px; border-radius: 50%; background: var(--vurgu); box-shadow: 0 0 0 2px var(--kart), 0 0 0 3px var(--cizgi); }
.kb-renk[data-vurgu-sec="tema"] .kb-renk-top { background: conic-gradient(var(--m1) 0 25%, var(--m2) 0 50%, var(--m3) 0 75%, var(--m4) 0); }
.kb-renk[aria-pressed="true"] .kb-renk-top::after { content: "\2713"; position: absolute; inset: 0; display: grid; place-items: center; color: var(--vurgu-yazi); font: 800 .95rem/1 system-ui, sans-serif; }
.kb-renk[data-vurgu-sec="tema"][aria-pressed="true"] .kb-renk-top::after { color: #fff; text-shadow: 0 0 3px #000, 0 0 1px #000; }
.kb-renk-ad { text-align: center; overflow-wrap: anywhere; }

@media (max-width: 600px) {
  .kb { padding: 16px 50px 16px 18px; margin-bottom: 16px; }
  .kb[data-kb-hiza="orta"] { padding: 18px 46px 16px; }
  .kb-ust { gap: 10px; }
  .kb-duzen { top: 4px; right: 4px; }
  .kb-cumle { font-size: .95rem; }
}
@media print {
  .kb { break-inside: avoid; box-shadow: none !important; transform: none !important; cursor: auto; }
  .kb-duzen, .kb-ipucu { display: none !important; }
}

/* ---- vurgu rengi (ayarlar.vurgu): tema icinde 6 hazir renk, acik + koyu ayri; AA olculur. Secici sirasi temalardan sonra gelir. */
[data-vurgu="gul"] { --vurgu: #a3284f; --vurgu-yazi: #ffffff; --vurgu-acik: #fbe3ea; }
[data-vurgu="mercan"] { --vurgu: #a63a17; --vurgu-yazi: #ffffff; --vurgu-acik: #fde4d8; }
[data-vurgu="bal"] { --vurgu: #7a5300; --vurgu-yazi: #ffffff; --vurgu-acik: #fbedc4; }
[data-vurgu="yaprak"] { --vurgu: #256b43; --vurgu-yazi: #ffffff; --vurgu-acik: #dcefe2; }
[data-vurgu="deniz"] { --vurgu: #1b5e8c; --vurgu-yazi: #ffffff; --vurgu-acik: #dbecf8; }

[data-mod="koyu"][data-vurgu="mercan"], [data-mod="koyu"] [data-vurgu="mercan"] { --vurgu: #ffab8a; --vurgu-yazi: #2a1206; --vurgu-acik: #4d2414; }

[data-mod="koyu"][data-vurgu="yaprak"], [data-mod="koyu"] [data-vurgu="yaprak"] { --vurgu: #8fd6ac; --vurgu-yazi: #0b2015; --vurgu-acik: #1f3a2b; }
[data-mod="koyu"][data-vurgu="deniz"], [data-mod="koyu"] [data-vurgu="deniz"] { --vurgu: #8cc8f0; --vurgu-yazi: #081c2b; --vurgu-acik: #1c3448; }
[data-mod="koyu"][data-vurgu="murdum"], [data-mod="koyu"] [data-vurgu="murdum"] { --vurgu: #c9a8ff; --vurgu-yazi: #1d1030; --vurgu-acik: #3a2a5a; }
/* hero ezmesi: yalniz hero'su koyu zemin + acik yazili temalarda (JS data-vurgu-hero koyar); acik/koyu modda ayni */
html[data-vurgu-hero][data-vurgu="gul"] { --hero-a: #7a2350; --hero-b: #9c2f60; --hero-yazi: #ffffff; --hero-soluk: #ffe0ec; }

html[data-vurgu-hero][data-vurgu="bal"] { --hero-a: #5c3f04; --hero-b: #7a5300; --hero-yazi: #ffffff; --hero-soluk: #fff0c8; }
html[data-vurgu-hero][data-vurgu="yaprak"] { --hero-a: #1b4a33; --hero-b: #256b43; --hero-yazi: #ffffff; --hero-soluk: #d3e9dc; }
html[data-vurgu-hero][data-vurgu="deniz"] { --hero-a: #0a3d62; --hero-b: #1b5e8c; --hero-yazi: #ffffff; --hero-soluk: #d6ecfa; }
html[data-vurgu-hero][data-vurgu="murdum"] { --hero-a: #47299a; --hero-b: #6a3fa0; --hero-yazi: #ffffff; --hero-soluk: #e6dcff; }

/* ---- hareket azalt: anahtar (data-hareket="az") ya da cihaz tercihi */
html[data-hareket="az"] *, html[data-hareket="az"] *::before, html[data-hareket="az"] *::after { animation: none !important; transition: none !important; scroll-behavior: auto !important; }

  *, *::before, *::after { animation-duration: .001ms !important; animation-iteration-count: 1 !important; transition-duration: .001ms !important; scroll-behavior: auto !important; }
}

<script>
/* Butce cekirdegi: saf fonksiyonlar, DOM yok, bagimlilik yok.
 *
 * Neden ayri dosya: urunun degeri arayuzde degil, bu matematigin dogrulugunda.
 * Alici "safe to spend" rakamina gore para harciyor. Rakam yanlissa alici
 * borclaniyor. O yuzden burada her sey OZDESLIK olarak test edilebilir olmali:
 * - para korunumu: acilis + gelir - gider == kapanis
 * - kategori toplamlari == tum hareketlerin toplami
 * - donemler zaman eksenini bosluksuz ve ustuste binmeden doser
 * - borc plani: toplam odeme == anapara + toplam faiz, butun bakiyeler sifir
 * - disa aktar -> ice aktar == birebir ayni durum
 *
 * Para birimi: KURUS (tamsayi). Kayan noktali para hesabi yapilmaz; 0.1 + 0.2
 * problemini bir butce uygulamasinda yasamak kabul edilemez.
 */

(function (kok) {
  "use strict";

  // ---------------------------------------------------------------- tarih
  // Saat dilimi tuzagina dusmemek icin her sey UTC ve "YYYY-AA-GG" metni.

  function g(metin) {
    const [y, a, gun] = metin.split("-").map(Number);
    return Date.UTC(y, a - 1, gun);
  }

  function m(zaman) {
    const d = new Date(zaman);
    return d.toISOString().slice(0, 10);
  }

  function gunEkle(metin, sayi) {
    return m(g(metin) + sayi * 86400000);
  }

  function ayEkle(metin, sayi) {
    const d = new Date(g(metin));
    const hedefGun = d.getUTCDate();
    const t = Date.UTC(d.getUTCFullYear(), d.getUTCMonth() + sayi, 1);
    const son = new Date(Date.UTC(new Date(t).getUTCFullYear(),
                                  new Date(t).getUTCMonth() + 1, 0)).getUTCDate();
    return m(Date.UTC(new Date(t).getUTCFullYear(), new Date(t).getUTCMonth(),
                      Math.min(hedefGun, son)));
  }

  function gunFarki(a, b) {
    return Math.round((g(b) - g(a)) / 86400000);
  }

  // ---------------------------------------------------------------- donem
  // Maas donemi. Alicinin butun dunyasi bu: "bir sonraki maasa kadar".

  const DONEM = {
    weekly: 7,
    biweekly: 14,
  };

  /** Verilen tarihi iceren odeme doneminin [baslangic, bitis) araligi.
   *  bitis, bir sonraki donemin baslangicidir: donemler bosluksuz doser. */
  function donemAraligi(donem, tarih) {
    const ilk = donem.ilkOdeme;
    if (donem.tip === "weekly" || donem.tip === "biweekly") {
      const adim = DONEM[donem.tip];
      const fark = gunFarki(ilk, tarih);
      const kac = Math.floor(fark / adim);
      const bas = gunEkle(ilk, kac * adim);
      return { bas: bas, bitis: gunEkle(bas, adim) };
    }
    if (donem.tip === "monthly") {
      // Her sinir ilkOdeme'nin GUNUNDEN yeniden hesaplanir: art arda ayEkle
      // 31'i bir kez 28'e kirpinca sonraki aylarda 28'de takili kalirdi.
      const di = new Date(g(ilk)), dt = new Date(g(tarih));
      let k = (dt.getUTCFullYear() - di.getUTCFullYear()) * 12
            + dt.getUTCMonth() - di.getUTCMonth();
      while (g(ayEkle(ilk, k)) > g(tarih)) k--;
      while (g(ayEkle(ilk, k + 1)) <= g(tarih)) k++;
      return { bas: ayEkle(ilk, k), bitis: ayEkle(ilk, k + 1) };
    }
    if (donem.tip === "semimonthly") {
      // Ayin 1'i ve 15'i
      const d = new Date(g(tarih));
      const yil = d.getUTCFullYear(), ay = d.getUTCMonth(), gun = d.getUTCDate();
      if (gun < 15) {
        return { bas: m(Date.UTC(yil, ay, 1)), bitis: m(Date.UTC(yil, ay, 15)) };
      }
      return { bas: m(Date.UTC(yil, ay, 15)), bitis: m(Date.UTC(yil, ay + 1, 1)) };
    }
    throw new Error("bilinmeyen donem tipi: " + donem.tip);
  }

  /** Ardisik n donem. Testte "bosluksuz doseme" ozdesligi icin. */
  function donemler(donem, baslangic, adet) {
    const liste = [];
    let t = baslangic;
    for (let i = 0; i < adet; i++) {
      const a = donemAraligi(donem, t);
      liste.push(a);
      t = a.bitis;
    }
    return liste;
  }

  // ---------------------------------------------------------------- faturalar

  /** Aralik icinde vadesi gelen, HENUZ ODENMEMIS faturalar.
   *  Fatura aylik tekrar eder; vadeGunu ayin gunudur (1-31).
   *  Ayin 31'i olmayan aylarda ayin son gunune kayar. */
  function vadesiGelenFaturalar(faturalar, aralik) {
    const cikti = [];
    for (const f of faturalar) {
      for (const vade of faturaVadeleri(f, aralik)) {
        if (!(f.odendi || []).includes(vade)) {
          cikti.push({ id: f.id, ad: f.ad, kurus: f.kurus, vade: vade });
        }
      }
    }
    return cikti.sort((a, b) => g(a.vade) - g(b.vade));
  }

  /** Bir faturanin [bas, bitis) icine dusen TUM vadeleri (odenmis olsa da).
   *  Sikliklar: monthly (varsayilan, vadeGunu), weekly/biweekly (ilkVade'den
   *  7/14 gun adimi), yearly (ilkVade'nin ay+gunu; 29 Subat -> 28 Subat). */
  function faturaVadeleri(f, aralik) {
    const tip = f.sikilik || "monthly";
    const bas = g(aralik.bas), bit = g(aralik.bitis);
    const vadeler = [];
    if (tip === "weekly" || tip === "biweekly") {
      const adim = tip === "weekly" ? 7 : 14;
      // ilkVade'den ONCE vade yok: fatura o gun baslar (gecmise dogru uzatilmaz)
      const k = Math.max(0, Math.floor(gunFarki(f.ilkVade, aralik.bas) / adim));
      for (let v = gunEkle(f.ilkVade, k * adim); g(v) < bit; v = gunEkle(v, adim)) {
        if (g(v) >= bas) vadeler.push(v);
      }
    } else if (tip === "yearly") {
      const ay = new Date(g(f.ilkVade)).getUTCMonth();
      const gun = new Date(g(f.ilkVade)).getUTCDate();
      const y0 = new Date(bas).getUTCFullYear(), y1 = new Date(bit).getUTCFullYear();
      for (let y = y0; y <= y1; y++) {
        const sonGun = new Date(Date.UTC(y, ay + 1, 0)).getUTCDate();
        const v = m(Date.UTC(y, ay, Math.min(gun, sonGun)));
        if (g(v) >= bas && g(v) < bit && g(v) >= g(f.ilkVade)) vadeler.push(v);
      }
    } else {
      // Araligin ilk ayindan sonuna kadar HER ay (aralik kac ay olursa olsun)
      const a0 = new Date(bas), a1 = new Date(bit);
      const aySayisi = (a1.getUTCFullYear() - a0.getUTCFullYear()) * 12
                     + a1.getUTCMonth() - a0.getUTCMonth();
      for (let k = 0; k <= aySayisi; k++) {
        const y = a0.getUTCFullYear(), ay = a0.getUTCMonth() + k;
        const sonGun = new Date(Date.UTC(y, ay + 1, 0)).getUTCDate();
        const v = m(Date.UTC(y, ay, Math.min(f.vadeGunu, sonGun)));
        if (g(v) >= bas && g(v) < bit) vadeler.push(v);
      }
    }
    return vadeler;
  }

  // ---------------------------------------------------------------- zarflar

  /** Bu donemde zarflara ayrilacak toplam. Hedefine ulasmis zarf para istemez. */
  function zarfTahsisi(zarflar) {
    let toplam = 0;
    for (const z of zarflar) {
      const kalan = Math.max(0, (z.hedefKurus || 0) - (z.birikmisKurus || 0));
      toplam += Math.min(z.donemBasiKurus || 0, kalan);
    }
    return toplam;
  }

  // ---------------------------------------------------------------- safe to spend

  /** Guvenli harcanabilir = bakiye - vadesi gelen odenmemis faturalar - zarf tahsisi - tampon
   *
   *  Urunun tek sayisi bu. Negatif cikabilir ve cikmalidir: alici acigi
   *  gormeli, gizlenmemeli. */
  function guvenliHarcanabilir(durum, bugun) {
    const aralik = donemAraligi(durum.donem, bugun);
    const faturalar = vadesiGelenFaturalar(durum.faturalar || [], aralik);
    const faturaToplam = faturalar.reduce((t, f) => t + f.kurus, 0);
    const zarf = zarfTahsisi(durum.zarflar || []);
    const tampon = Math.max(0, durum.tamponKurus || 0);
    // "toplam" modu: banka bakiyesi girilmez; kaynak = maas + bu donemde kaydedilen tum hareketler (gelir +, gider −, odenen fatura −)
    const mod = durum.hesapModu === "toplam" ? "toplam" : "bakiye";
    const kaynak = mod === "toplam"
      ? (durum.maasKurus || 0) + (durum.hareketler || []).reduce((t, h) => (h.tarih >= aralik.bas && h.tarih < aralik.bitis ? t + h.kurus : t), 0)
      : (durum.bakiyeKurus || 0);
    const guvenli = kaynak - faturaToplam - zarf - tampon;
    const kalanGun = gunFarki(bugun, aralik.bitis);
    return {
      aralik: aralik,
      bakiyeKurus: kaynak,
      mod: mod,
      faturaKurus: faturaToplam,
      zarfKurus: zarf,
      tamponKurus: tampon,
      guvenliKurus: guvenli,
      faturaListesi: faturalar,
      kalanGun: kalanGun,
      gunlukKurus: gunlukPay(guvenli, kalanGun),
    };
  }

  /** Gunluk pay: guvenli tutarin kalan gunlere asagi yuvarlanmis bolumu.
   *  Negatif ya da sifir guvenli tutarda 0 (alici "eksi gunluk" gormez; eksiyi
   *  ana sayi zaten gosterir). Hicbir zaman guvenli tutari asmaz. */
  function gunlukPay(guvenliKurus, kalanGun) {
    if (!(guvenliKurus > 0) || !(kalanGun > 0)) return 0;
    return Math.floor(guvenliKurus / kalanGun);
  }

  // ---------------------------------------------------------------- guven etiketi

  /** Bakiyenin ne kadar guncel oldugunu dürüstce söyler.
   *  "fresh": bugün/dün dogrulandi; "guess": 2-4 gun; "fuzzy": 5+ gun ya da hic.
   *  Ayrica kac gun gectigini doner ki ekran "checked 3 days ago" diyebilsin. */
  function guvenSeviyesi(durum, bugun) {
    if (durum.hesapModu === "toplam") return { seviye: "guess", gun: null, mod: "toplam" }; // bakiye girilmedi: en fazla "iyi tahmin"
    if (!durum.bakiyeTarihi) return { seviye: "fuzzy", gun: null };
    const gun = Math.max(0, gunFarki(durum.bakiyeTarihi, bugun));
    return { seviye: gun <= 1 ? "fresh" : gun <= 4 ? "guess" : "fuzzy", gun: gun };
  }

  /** Son etkinlik: bakiye dogrulama ya da son hareket, hangisi yeniyse. */
  function sonEtkinlik(durum) {
    let son = durum.bakiyeTarihi || null;
    for (const h of durum.hareketler || []) if (!son || h.tarih > son) son = h.tarih;
    return son;
  }

  /** "Welcome back" karti: 3+ gun hicbir sey girilmediyse. Hic etkinlik yoksa
   *  (yeni kurulum) kart cikmaz: karsilanacak bir "geri" yok. */
  function donusKartiGerekli(durum, bugun) {
    const son = sonEtkinlik(durum);
    return !!son && gunFarki(son, bugun) >= 3;
  }

  // ---------------------------------------------------------------- geri al

  const GERI_SINIR = 30;

  /** Geri al yigini METIN anlik goruntuleri tutar (disaAktar ciktisi): sonradan
   *  durum degisse bile eski goruntu degismez. Yigin degismez dizi gibi
   *  kullanilir; her islem yeni dizi doner. */
  function geriyeAl(yigin, durum) {
    const yeni = yigin.concat([disaAktar(durum)]);
    return yeni.length > GERI_SINIR ? yeni.slice(yeni.length - GERI_SINIR) : yeni;
  }

  /** Son goruntuyu geri yukler: {durum, yigin} ya da yigin bossa null. */
  function geriAl(yigin) {
    if (!yigin.length) return null;
    const son = yigin[yigin.length - 1];
    const d = iceAktar(son);
    delete d.surum;
    return { durum: d, yigin: yigin.slice(0, -1) };
  }

  // ---------------------------------------------------------------- hareketler

  function kategoriToplamlari(hareketler) {
    const t = {};
    for (const h of hareketler) t[h.kategori] = (t[h.kategori] || 0) + h.kurus;
    return t;
  }

  /** Para korunumu: acilis + gelir - gider == kapanis.
   *  Hareket kurusu pozitifse gelir, negatifse giderdir. */
  function bakiyeAkisi(acilisKurus, hareketler) {
    let gelir = 0, gider = 0;
    for (const h of hareketler) {
      if (h.kurus >= 0) gelir += h.kurus;
      else gider += -h.kurus;
    }
    return {
      acilisKurus: acilisKurus,
      gelirKurus: gelir,
      giderKurus: gider,
      kapanisKurus: acilisKurus + gelir - gider,
    };
  }

  // ---------------------------------------------------------------- borc

  /** Borc kartopu (snowball: kucuk bakiye once) / cig (avalanche: yuksek faiz once).
   *
   *  Aylik faiz = bakiye * yillikOran / 12, tam sayiya yuvarlanir.
   *  Donus: {aylar:[{ay, odemeler:[{id,kurus}], faizKurus, kalanKurus}], toplam...}
   *  Sonsuz donguye karsi ust sinir var: asgari odemeler faizi karsilamiyorsa
   *  plan "kapanmaz" isaretiyle doner - sessizce yanlis sayi uretmez. */
  function borcPlani(borclar, ekOdemeKurus, yontem, enFazlaAy) {
    enFazlaAy = enFazlaAy || 600;
    const kalan = borclar.map((b) => ({
      id: b.id, ad: b.ad, kurus: b.bakiyeKurus,
      oran: b.yillikOran || 0, asgari: b.asgariKurus || 0,
    }));
    const aylar = [];
    let toplamFaiz = 0, toplamOdeme = 0;

    for (let ay = 1; ay <= enFazlaAy; ay++) {
      const acik = kalan.filter((b) => b.kurus > 0);
      if (!acik.length) break;

      let faizBu = 0;
      for (const b of acik) {
        const faiz = Math.round(b.kurus * b.oran / 12);
        b.kurus += faiz;
        faizBu += faiz;
      }
      toplamFaiz += faizBu;

      acik.sort(yontem === "avalanche"
        ? (x, y) => y.oran - x.oran || x.kurus - y.kurus
        : (x, y) => x.kurus - y.kurus || y.oran - x.oran);

      let butce = acik.reduce((t, b) => t + b.asgari, 0) + ekOdemeKurus;
      const odemeler = [];
      // Once asgariler, sonra artan tutar hedef borca
      for (const b of acik) {
        const ode = Math.min(b.asgari, b.kurus, butce);
        b.kurus -= ode; butce -= ode;
        if (ode > 0) odemeler.push({ id: b.id, kurus: ode });
      }
      for (const b of acik) {
        if (butce <= 0) break;
        const ode = Math.min(butce, b.kurus);
        if (ode <= 0) continue;
        b.kurus -= ode; butce -= ode;
        const v = odemeler.find((o) => o.id === b.id);
        if (v) v.kurus += ode; else odemeler.push({ id: b.id, kurus: ode });
      }
      const odemeBu = odemeler.reduce((t, o) => t + o.kurus, 0);
      toplamOdeme += odemeBu;
      aylar.push({
        ay: ay, odemeler: odemeler, faizKurus: faizBu,
        kalanKurus: kalan.reduce((t, b) => t + b.kurus, 0),
      });
      if (odemeBu === 0) break; // ilerleme yok: sonsuz donguyu kes
    }

    const kapandi = kalan.every((b) => b.kurus === 0);
    return {
      aylar: aylar,
      kapandi: kapandi,
      ayAdedi: aylar.length,
      toplamFaizKurus: toplamFaiz,
      toplamOdemeKurus: toplamOdeme,
      anaparaKurus: borclar.reduce((t, b) => t + b.bakiyeKurus, 0),
      kalanKurus: kalan.reduce((t, b) => t + b.kurus, 0),
    };
  }

  // ---------------------------------------------------------------- tutar metni

  /** Kullanicinin yazdigi tutari kurus tamsayiya cevirir; gecersizse null.
   *  Kayan nokta yok: metin parcalanir. Son ayirac 1-2 haneli kesirse
   *  ondaliktir ("12,50", "1.234,56", "1,234.56"); 3 haneliyse binliktir. */
  function kurusAyristir(metin) {
    let s = String(metin == null ? "" : metin).trim().replace(/\s/g, "");
    s = s.replace(/^[^\d.,\-−]+/, ""); // basta para simgesi
    let eksi = false;
    if (s[0] === "-" || s[0] === "−") { eksi = true; s = s.slice(1); }
    if (!s) return null;
    let tam, kesir = "";
    const kes = s.match(/^(.*?)([.,])(\d{1,2})$/);
    if (/^\d+$/.test(s)) {
      tam = s;
    } else if (kes) {
      // Ondalik: tam kisim ya duz rakam ya da OTEKI ayracla 3'erli gruplu
      const t = kes[1];
      const grup = new RegExp("^\\d{1,3}(\\" + (kes[2] === "." ? "," : ".") + "\\d{3})+$");
      if (!(t === "" || /^\d+$/.test(t) || grup.test(t))) return null;
      tam = t.replace(/[.,]/g, "");
      kesir = kes[3];
    } else if (/^\d{1,3}([.,]\d{3}){2,}$/.test(s)
               && new Set(s.match(/[.,]/g)).size === 1) {
      tam = s.replace(/[.,]/g, ""); // 1,234,567: yalniz birden fazla grup belirsiz degil
    } else {
      return null; // "5.999", "1.2.3", "1,,2": belirsiz ya da bozuk
    }
    if (tam === "" && kesir === "") return null;
    if (tam.length > 12) return null;
    const kurus = Number(tam || "0") * 100 + Number((kesir + "00").slice(0, 2));
    return eksi ? -kurus : kurus;
  }

  /** Kurusu "1,234.50" metnine cevirir (isaret basta, simge yok). */
  function kurusMetni(kurus) {
    const mutlak = Math.abs(kurus);
    const tam = Math.floor(mutlak / 100);
    const kesir = String(mutlak % 100).padStart(2, "0");
    const grup = String(tam).replace(/\B(?=(\d{3})+(?!\d))/g, ",");
    return (kurus < 0 ? "-" : "") + grup + "." + kesir;
  }

  // ---------------------------------------------------------------- dogrulama

  const SINIR = 100000000000000; // 1e14 kurus: guvenli tamsayi sinirinin cok altinda

  function kurusMu(x) { return Number.isSafeInteger(x) && Math.abs(x) <= SINIR; }
  function tarihMi(x) {
    return typeof x === "string" && /^\d{4}-\d{2}-\d{2}$/.test(x) && m(g(x)) === x;
  }

  /** Yuklenen/ice aktarilan durumun sekli ve turleri dogru mu?
   *  Donus: null (gecerli) ya da ilk hatanin yolu ("faturalar[0].kurus").
   *  Boylece bozuk bir yedek hesaba hic girmez; metin+sayi toplama, NaN,
   *  kesirli kurus gibi sessiz yanlis rakamlar uretilmez. */
  /** v2 alanlari: bozuk ya da elle duzenlenmis yedek ekrani cokertmesin / sessiz yanlis rakam uretmesin.
   *  Alan yoksa serbest (eski yedekler); varsa tur ve para alanlari dogru olmali. */
  const PARA_ALANLARI = ["kurus", "limitKurus", "hedefKurus", "birikmisKurus", "donemBasiKurus", "bakiyeKurus", "asgariKurus", "taksitKurus"];
  const DIZI_ALANLARI = ["hesaplar", "kategoriler", "gelirler", "maaslar", "hedefler", "meydanOkumalar", "borclar", "gorevler", "beyin", "rutinler", "bekleme", "geriGelen", "kilometre", "hizliDugmeler", "borcOdemeleri", "skorlar", "abonelikler", "kartlar"];
  /** Kisisellestirme (v2/kisisel): ad <= 30, cumle <= 90, rozet <= 24, emoji <= 8 karakter (kod noktasi), hizali orta|sol.
   *  Alan yoksa serbest (eski yedekler). Kontrol karakteri / satir sonu yok. Metin her zaman duz metin olarak cizilir (textContent). */
  const KISISEL_SINIR = { ad: 30, cumle: 90, rozet: 24, emoji: 8 };
  const VURGULAR = ["tema", "gul", "mercan", "bal", "yaprak", "deniz", "murdum"]; // ayarlar.vurgu: "tema" = temanin kendi rengi
  function kisiselHatasi(d) {
    const k = d.kisisel;
    if (k !== undefined) {
      if (!k || typeof k !== "object" || Array.isArray(k)) return "kisisel";
      for (const alan of Object.keys(KISISEL_SINIR)) {

    const liste = [], yeniler = [], kazanilan = [];
    let sonrakiVerildi = false;
    for (const id of KILOMETRE) {
      const kazanildi = kayitli.indexOf(id) >= 0 || simdi[id];
      const yeni = kazanildi && kayitli.indexOf(id) < 0;
      let sonraki = false;
      if (!kazanildi && !sonrakiVerildi) { sonraki = true; sonrakiVerildi = true; }
      if (yeni) yeniler.push(id);
      if (kazanildi) kazanilan.push(id);
      liste.push({ id: id, kazanildi: kazanildi, yeni: yeni, sonraki: sonraki });
    }
    // bilinmeyen eski kayitlar da korunur
    for (const id of kayitli) if (KILOMETRE.indexOf(id) < 0) kazanilan.push(id);
    return { liste: liste, kazanilan: kazanilan, yeniler: yeniler };
  }

  // ---------------------------------------------------------------- borc

  /** Gercek kartopu (kapanan borcun asgarisi havuzda kalir) icin Borc.plan; eski butce.borcPlani devri yapmiyordu.
   *  Bozuk girdide (hata) kapanmayan plan gibi doner: sessizce yanlis sayi uretmez. */
  function bp(borclar, ek, yontem) {
    const p = Borc.plan(borclar, { strateji: yontem === "avalanche" ? "avalanche" : "snowball", ekAylikKurus: ek, enFazlaAy: 600 });
    if (p.hata) return { kapandi: false, ayAdedi: 0, toplamFaizKurus: 0, toplamOdemeKurus: 0, kalanKurus: borclar.reduce((t, b) => t + (b.bakiyeKurus || 0), 0), anaparaKurus: borclar.reduce((t, b) => t + (b.bakiyeKurus || 0), 0), aylar: [], hata: p.hata };
    return p;
  }

  /** Ek odemeyle kapanmasi icin gereken en kucuk aylik ek tutar (kurus); olmazsa null. */
  function enAzEk(borclar, yontem) {
    const anapara = borclar.reduce((t, b) => t + (b.bakiyeKurus > 0 ? b.bakiyeKurus : 0), 0);
    if (anapara === 0) return 0;
    const kapanir = (ek) => bp(borclar, ek, yontem).kapandi;
    let lo = 0, hi = anapara * 2;
    if (!B.kurusMu(hi) || !kapanir(hi)) return null;
    while (lo < hi) {
      const mid = Math.floor((lo + hi) / 2);
      if (kapanir(mid)) hi = mid; else lo = mid + 1;
    }
    return lo;
  }

  function ozet(p, bugun) {
    return {
      kapandi: p.kapandi, ayAdedi: p.ayAdedi, faizKurus: p.toplamFaizKurus, odemeKurus: p.toplamOdemeKurus,
      kalanKurus: p.kalanKurus, borcsuzTarih: p.kapandi ? B.ayEkle(bugun, p.ayAdedi) : null,
    };
  }

  /** Ek odeme yokken ve ekKurus ile borc planlari + fark. Sessizce yanlis sayi uretmez:
   *  kapanmayan plan icin tarih/fark yok, gerekliEkKurus var. */
  function borcKarsilastir(borclar, ekKurus, yontem, bugun) {
    const ek = Math.max(0, ekKurus || 0);
    if (!borclar.some((b) => b.bakiyeKurus > 0)) return { bos: true };
    const pT = bp(borclar, 0, yontem);
    const pE = ek > 0 ? bp(borclar, ek, yontem) : pT;
    const taban = ozet(pT, bugun), ekli = ozet(pE, bugun);
    const ikisiKapandi = taban.kapandi && ekli.kapandi;
    return {
      bos: false, yontem: yontem, ekKurus: ek,
      taban: taban, ekli: ekli, anaparaKurus: pT.anaparaKurus,
      kapaniyor: ekli.kapandi,
      ekKapatir: !taban.kapandi && ekli.kapandi,
      erkenAy: ikisiKapandi ? taban.ayAdedi - ekli.ayAdedi : null,
      azFaizKurus: ikisiKapandi ? taban.faizKurus - ekli.faizKurus : null,
      gerekliEkKurus: ekli.kapandi ? 0 : enAzEk(borclar, yontem),
      ekliPlan: pE,
    };
  }

  /** Ilk ayda fazla odemenin gidecegi borcun id'si (motorla ayni sira: faiz eklendikten sonra). */
  function hedefBorc(borclar, yontem) {
    const acik = borclar.filter((b) => b.bakiyeKurus > 0).map((b) => ({
      id: b.id, kurus: b.bakiyeKurus + Math.round(b.bakiyeKurus * (b.yillikOran || 0) / 12), oran: b.yillikOran || 0,
    }));
    if (!acik.length) return null;
    acik.sort(yontem === "avalanche"
      ? (x, y) => y.oran - x.oran || x.kurus - y.kurus
      : (x, y) => x.kurus - y.kurus || y.oran - x.oran);
    return acik[0].id;
  }

  // ---------------------------------------------------------------- "bu harcama sigar mi" / bakiye guveni

  /** Bu harcama guvenli tutara sigar mi, harcamadan sonra ne kalir. */
  function sigarMi(durum, bugun, kurus) {
    if (!B.kurusMu(kurus) || kurus <= 0) return { gecersiz: true };
    const g = B.guvenliHarcanabilir(durum, bugun);
    const kalan = g.guvenliKurus - kurus;
    if (!B.kurusMu(kalan)) return { gecersiz: true };
    return {
      gecersiz: false, sigar: kalan >= 0, guvenliKurus: g.guvenliKurus, kalanKurus: kalan,
      kalanGun: g.kalanGun, gunlukKurus: B.gunlukPay(kalan, g.kalanGun),
    };
  }

  /** "Check my balance" icin guven ozeti: bakiye ne kadar guncel, hemen ne yapmali. */
  function guvenOzeti(durum, bugun) {
    const s = B.guvenSeviyesi(durum, bugun);
    const g = B.guvenliHarcanabilir(durum, bugun);
    return {
      seviye: s.seviye, gun: s.gun, bakiyeTarihi: durum.bakiyeTarihi || null,
      guvenliKurus: g.guvenliKurus, bakiyeKurus: g.bakiyeKurus, kalanGun: g.kalanGun,
      sonEtkinlik: B.sonEtkinlik(durum), kontrolOnerilir: s.seviye !== "fresh",
    };
  }

  const API = {
    ayAraligi: ayAraligi, maasGunleri: maasGunleri, maasKaynaklari: maasKaynaklari,
    ayIzgarasi: ayIzgarasi, icsOlaylari: icsOlaylari,
    HAFTA: HAFTA, MEYDAN_TIPLERI: MEYDAN_TIPLERI, BIRIM_SINIR: BIRIM_SINIR,
    haftaTutari: haftaTutari, haftaDegistir: haftaDegistir, haftaTemiz: haftaTemiz, meydanOzeti: meydanOzeti,
    hedefPlani: hedefPlani, COK_UZAK: COK_UZAK,
    KILOMETRE: KILOMETRE, kilometreTaslari: kilometreTaslari,
    borcKarsilastir: borcKarsilastir, enAzEk: enAzEk, hedefBorc: hedefBorc,
    sigarMi: sigarMi, guvenOzeti: guvenOzeti,
  };
  if (typeof module !== "undefined" && module.exports) module.exports = API;
  else kok.Plan = API;
})(typeof globalThis !== "undefined" ? globalThis : this);

/* Kredi puani (credit score) takibi: saf fonksiyonlar, DOM yok, dis istek yok.
 *
 * kayit: {id, tarih:"YYYY-AA-GG", puan: tamsayi, kaynak?: metin (<= 40 karakter)}
 * Liste her zaman tarihe gore artan sirada, her tarihte EN FAZLA bir kayit (ayni tarihe
 * yeni kayit eskisinin yerine gecer: "son yazan kazanir"). Fonksiyonlar listeyi
 * yerinde DEGISTIRMEZ, yeni liste doner.
 * Puan araligi varsayilan 300..850 (FICO/VantageScore 3+); cagiran degistirebilir.
 */
(function (kok) {
  "use strict";

  const ARALIK = { min: 300, max: 850 };
  const BANTLAR = [ // [alt sinir, ad] FICO bantlari
    [800, "exceptional"], [740, "very good"], [670, "good"], [580, "fair"], [300, "poor"],
  ];

  function tarihMi(x) {
    if (typeof x !== "string" || !/^\d{4}-\d{2}-\d{2}$/.test(x)) return false;
    const [y, a, g] = x.split("-").map(Number);
    return new Date(Date.UTC(y, a - 1, g)).toISOString().slice(0, 10) === x;
  }
  function gunNo(t) { const [y, a, g] = t.split("-").map(Number); return Math.round(Date.UTC(y, a - 1, g) / 86400000); }

  /** {ok, hata}: hata alan adi ("tarih", "puan", ...) ya da null. */
  function dogrula(kayit, aralik) {
    const r = aralik || ARALIK;
    const k = kayit;
    if (!k || typeof k !== "object" || Array.isArray(k)) return { ok: false, hata: "kayit" };
    if (!((typeof k.id === "string" && k.id !== "") || Number.isSafeInteger(k.id))) return { ok: false, hata: "id" };
    if (!tarihMi(k.tarih)) return { ok: false, hata: "tarih" };
    if (!Number.isSafeInteger(k.puan) || k.puan < r.min || k.puan > r.max) return { ok: false, hata: "puan" };
    if (k.kaynak != null && (typeof k.kaynak !== "string" || k.kaynak.length > 40)) return { ok: false, hata: "kaynak" };
    return { ok: true, hata: null };
  }

  function sirala(liste) { return liste.slice().sort((a, b) => (a.tarih < b.tarih ? -1 : a.tarih > b.tarih ? 1 : 0)); }

  /** Yeni liste: kayit eklenir; ayni id (duzenleme) ya da ayni tarihli eski kayit cikarilir.
   *  Bozuk kayit: ORIJINAL liste (ayni nesne) doner, hicbir sey degismez. */
  function ekle(liste, kayit, aralik) {
    if (!dogrula(kayit, aralik).ok) return liste;
    const yeni = { id: kayit.id, tarih: kayit.tarih, puan: kayit.puan };
    if (kayit.kaynak != null && kayit.kaynak !== "") yeni.kaynak = kayit.kaynak;
    const kalan = (liste || []).filter((x) => x.id !== kayit.id && x.tarih !== kayit.tarih);
    kalan.push(yeni);
    return sirala(kalan);
  }

  function sil(liste, id) { return (liste || []).filter((x) => x.id !== id); }
  function son(liste) { return liste && liste.length ? liste[liste.length - 1] : null; }

  /** Son kaydin bir oncekine gore farki: {fark, oncekiTarih} ya da (2 kayittan azsa) null. */
  function degisim(liste) {
    if (!liste || liste.length < 2) return null;
    const a = liste[liste.length - 2], b = liste[liste.length - 1];
    return { fark: b.puan - a.puan, oncekiTarih: a.tarih };
  }

  /** Son n kaydin en kucuk kareler egimi (x = kayit sirasi 0..k-1), TAMSAYI aritmetigi:
   *  egim = pay / payda, pay = k*Sxy - Sx*Sy, payda = k*Sxx - Sx^2 (> 0).
   *  |egim| < 1 puan/kayit (|pay| < payda) -> "flat"; 2 kayittan az -> null. */
  function egilim(liste, n) {
    n = n == null ? 6 : n;
    if (!liste || n < 2) return null;
    const s = liste.slice(-n), k = s.length;
    if (k < 2) return null;
    let sx = 0, sy = 0, sxy = 0, sxx = 0;
    for (let i = 0; i < k; i++) { sx += i; sy += s[i].puan; sxy += i * s[i].puan; sxx += i * i; }
    const pay = k * sxy - sx * sy, payda = k * sxx - sx * sx;
    if (Math.abs(pay) < payda) return "flat";
    return pay > 0 ? "up" : "down";
  }

  /** Grafik noktalari: [ilkTarih, sonTarih] (dahil) araligindaki kayitlar,
   *  {tarih, puan, gun: ilkTarih'ten gun farki}. Tarih verilmezse sinir yok (gun ilk kayittan). */
  function seri(liste, ilkTarih, sonTarih) {
    const l = (liste || []).filter((x) => (!ilkTarih || x.tarih >= ilkTarih) && (!sonTarih || x.tarih <= sonTarih));
    if (!l.length) return [];
    const taban = gunNo(ilkTarih || l[0].tarih);
    return l.map((x) => ({ tarih: x.tarih, puan: x.puan, gun: gunNo(x.tarih) - taban }));
  }

  /** FICO bandi; tamsayi degilse ya da 300..850 disindaysa null. */
  function bant(puan) {
    if (!Number.isSafeInteger(puan) || puan < 300 || puan > 850) return null;
    for (const [alt, ad] of BANTLAR) if (puan >= alt) return ad;
    return null;
  }

  /** Yuklenen liste dogru mu? null ya da ilk hatanin yolu ("skorlar[2].tarih"). */
  function durumHatasi(liste, aralik) {
    if (!Array.isArray(liste)) return "skorlar";
    const idler = new Set();
    for (let i = 0; i < liste.length; i++) {
      const d = dogrula(liste[i], aralik);
      if (!d.ok) return "skorlar[" + i + "]" + (d.hata === "kayit" ? "" : "." + d.hata);
      if (idler.has(String(liste[i].id))) return "skorlar[" + i + "].id";
      idler.add(String(liste[i].id));
      if (i > 0 && !(liste[i - 1].tarih < liste[i].tarih)) return "skorlar[" + i + "].tarih"; // sirali, tarih tekil
    }
    return null;
  }

  const API = { dogrula: dogrula, ekle: ekle, sil: sil, son: son, degisim: degisim, egilim: egilim,
    seri: seri, bant: bant, durumHatasi: durumHatasi, ARALIK: ARALIK };
  if (typeof module !== "undefined" && module.exports) module.exports = API;
  else kok.Skor = API;
})(typeof globalThis !== "undefined" ? globalThis : this);

/* Transfer code (cihazlar arasi aktarim, sunucusuz, kutuphanesiz, sikistirmasiz).
 * Bicim:  PLN1.<urun>.<bayt uzunlugu>.<crc32 hex8>.<base64url(UTF-8, bosluksuz JSON)>
 * uret(metin, urun): metin = B.disaAktar ciktisi (JSON). Bosluklar atilir; anahtar sirasi korunur, boylece
 *   disaAktar(iceAktar(coz(uret(x)).metin)) === x (metin olarak birebir).
 * coz(kod, urun): {metin} ya da {hata: "bos"|"bicim"|"urun"|"kisa"|"bozuk"}. Icerik dogrulamasi (durumHatasi) cagiranin isidir.

(function (kok) {

  var ONEK = "PLN1";
  var ABC = "ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789-_";
  var GERI = {}; for (var i = 0; i < ABC.length; i++) GERI[ABC.charAt(i)] = i;
  var TABLO = (function () { var t = [], c; for (var n = 0; n < 256; n++) { c = n; for (var k = 0; k < 8; k++) c = c & 1 ? 0xEDB88320 ^ (c >>> 1) : c >>> 1; t[n] = c >>> 0; } return t; })();

/* Urun ortak katmani (yalniz --urun derlemeleri, borc HARIC: borc ve ana urun ciktisi bayt bayt ayni kalsin diye derle.js eklemez).
 * Settings > "Fill with sample data": kullanicinin kendi verisi varken ONAY sorar (onceden sessizce ezip "Done." + Undo diyordu).
 *  - Urun kendi yolunu verirse (App.urunOrnekYukle; dugun: anlik goruntulu O.ornekYukle) o kullanilir.
 *  - Yoksa: veri var mi? App.urunVeriVar() varsa o, yoksa durum varsayilanla karsilastirilir (ayarlar/kisisel/kuruldu disinda dolu dizi).
 * ayarlar.js'e dokunulmaz (ana urunde de yuklenir): dugme Settings cizilince isaretlenir (data-ornek-doldur), tiklama yakalama
 * evresinde alinir ve ayarlar.js'in kendi dinleyicisi calismaz. Metinler: v2/urun-ortak/ceviri.json (5 dil). */
(function () {

  var DISI = { ayarlar: 1, kisisel: 1, kuruldu: 1 };

  function doluFark(x, v) {
    if (Array.isArray(x)) return x.length > 0 && JSON.stringify(x) !== JSON.stringify(v || []);
    if (x && typeof x === "object") return Object.keys(x).some(function (k) { return doluFark(x[k], v && typeof v === "object" ? v[k] : undefined); });

    return Object.keys(d).some(function (k) { return !DISI[k] && doluFark(d[k], v[k]); });
  };
  App.ornekDoldur = function () {
    if (App.urunOrnekYukle) { App.urunOrnekYukle(); return; }
    function yukle() { App.degistir(App.ornekVeri(), t("ayar.hazir", "Done.")); }

    bar.appendChild(el("span", { metin: "Free demo · saved in this browser only" }));
    bar.appendChild(el("span", {}, el("b", { metin: String(sayac()) }), " of " + D.limit + " spends logged"));
    bar.appendChild(el("button", { type: "button", class: "al", metin: "Get the full planner", onclick: satinAl }));
    bar.appendChild(el("button", { type: "button", class: "lnk", metin: "Save my setup", onclick: yedekKaydet }));
  }
  var yenileAsil = App.yenile;
  App.yenile = function () { yenileAsil.apply(App, arguments); barCiz(); };
  function yukseklik() { document.documentElement.style.setProperty("--demo-h", bar.offsetHeight + "px"); }
  window.addEventListener("resize", yukseklik);
  // Not: bu betik App.baslat()'tan ONCE calisir (App.durum henuz null). Ilk cizim App.yenile sarmalindan gelir.
  var yenileSon = App.yenile;
  App.yenile = function () { yenileSon.apply(App, arguments); yukseklik(); };

  // Yedek geri yuklemesi kilitli ayarlari (dil, tema) acmasin
  App.demoDuzelt = function (d) {
    d.ayarlar = d.ayarlar || {};
    d.ayarlar.dil = "en";
    d.ayarlar.tema = "sarmasik";
    return d;
  };
})();
